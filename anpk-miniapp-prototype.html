<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a7069">
  <title>安派科健康检测 · 小程序交互原型</title>
  <style>
    :root {
      --brand: #0a7069;
      --brand-dark: #075650;
      --brand-soft: #e5f4f1;
      --mint: #bfe9df;
      --orange: #f18742;
      --orange-soft: #fff1e7;
      --ink: #173735;
      --muted: #6c817f;
      --line: #e3ecea;
      --surface: #ffffff;
      --canvas: #eef5f3;
      --danger: #d95858;
      --warning: #d18b18;
      --success: #1e906d;
      --shadow: 0 14px 40px rgba(19, 65, 61, .12);
      --phone-shadow: 0 34px 90px rgba(13, 57, 53, .24), 0 4px 16px rgba(13, 57, 53, .12);
      --radius: 18px;
      --font: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 10%, rgba(191, 233, 223, .58), transparent 28%),
        radial-gradient(circle at 86% 84%, rgba(255, 220, 195, .48), transparent 24%),
        linear-gradient(145deg, #f4f9f7, #e7f0ee);
      overflow: hidden;
    }

    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid rgba(10, 112, 105, .2);
      outline-offset: 2px;
    }

    .prototype-shell {
      height: 100vh;
      display: grid;
      grid-template-columns: 276px minmax(420px, 1fr) 286px;
      gap: 26px;
      padding: 22px 26px;
    }

    .review-panel,
    .inspector {
      align-self: center;
      max-height: calc(100vh - 44px);
      overflow: auto;
      border: 1px solid rgba(255, 255, 255, .76);
      border-radius: 26px;
      background: rgba(255, 255, 255, .76);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      scrollbar-width: thin;
    }

    .review-panel { padding: 24px 18px 18px; }
    .brand-lockup { display: flex; align-items: center; gap: 12px; padding: 0 6px 20px; }
    .brand-mark {
      width: 44px; height: 44px; border-radius: 15px;
      display: grid; place-items: center;
      background: linear-gradient(145deg, var(--brand), #39a799);
      color: #fff; font-size: 21px; font-weight: 800;
      box-shadow: 0 10px 24px rgba(10, 112, 105, .22);
    }
    .brand-lockup h1 { margin: 0; font-size: 17px; line-height: 1.3; }
    .brand-lockup p { margin: 3px 0 0; font-size: 11px; color: var(--muted); }
    .panel-label {
      margin: 14px 6px 8px;
      color: #91a5a2;
      font-size: 10px;
      letter-spacing: .14em;
      font-weight: 800;
      text-transform: uppercase;
    }
    .scene-btn {
      width: 100%; border: 0; background: transparent;
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; margin: 2px 0; border-radius: 13px;
      cursor: pointer; text-align: left; font-size: 13px;
      transition: .2s ease;
    }
    .scene-btn:hover { background: #eef7f5; transform: translateX(2px); }
    .scene-btn.active { color: var(--brand-dark); background: var(--brand-soft); font-weight: 700; }
    .scene-icon {
      width: 28px; height: 28px; border-radius: 9px;
      display: grid; place-items: center;
      background: #eff4f3; color: var(--muted); font-size: 12px; font-weight: 800;
    }
    .scene-btn.active .scene-icon { color: #fff; background: var(--brand); }
    .panel-foot {
      margin-top: 18px; padding: 14px; border-radius: 16px;
      background: linear-gradient(145deg, #133f3b, #0b6861);
      color: #fff;
    }
    .panel-foot strong { font-size: 12px; }
    .panel-foot p { margin: 6px 0 0; font-size: 10px; line-height: 1.7; color: rgba(255,255,255,.7); }

    .stage {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .stage-toolbar {
      width: min(420px, 100%);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 8px 10px;
      color: var(--muted); font-size: 11px;
    }
    .stage-toolbar .live { display: flex; align-items: center; gap: 7px; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #37b58b; box-shadow: 0 0 0 5px rgba(55,181,139,.11); }
    .stage-toolbar button {
      border: 0; background: rgba(255,255,255,.65); color: var(--brand-dark);
      padding: 6px 10px; border-radius: 10px; cursor: pointer;
    }

    .phone {
      width: 390px;
      height: min(844px, calc(100vh - 78px));
      min-height: 650px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 7px solid #173a37;
      border-radius: 42px;
      background: #f5f8f7;
      box-shadow: var(--phone-shadow);
      position: relative;
    }
    .phone::before {
      content: "";
      position: absolute; z-index: 10;
      top: 8px; left: 50%; transform: translateX(-50%);
      width: 92px; height: 23px; border-radius: 0 0 15px 15px;
      background: #173a37;
      pointer-events: none;
    }
    .statusbar {
      flex: 0 0 32px;
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 18px 0;
      background: #fff;
      color: #193b38; font-size: 10px; font-weight: 800;
    }
    .status-icons { display: flex; gap: 5px; align-items: center; }
    .signal { letter-spacing: -2px; }
    .battery { border: 1.5px solid currentColor; width: 17px; height: 8px; border-radius: 2px; padding: 1px; }
    .battery::before { content: ""; display: block; width: 85%; height: 100%; background: currentColor; border-radius: 1px; }
    .app-header {
      flex: 0 0 52px;
      display: grid;
      grid-template-columns: 50px 1fr 50px;
      align-items: center;
      padding: 0 10px;
      background: rgba(255,255,255,.96);
      border-bottom: 1px solid rgba(228,236,234,.8);
      position: relative; z-index: 4;
    }
    .app-header.home-style { background: #fff; border-bottom-color: transparent; }
    .header-title { text-align: center; font-size: 16px; font-weight: 800; }
    .header-action {
      border: 0; background: transparent; cursor: pointer;
      width: 38px; height: 38px; border-radius: 12px;
      display: grid; place-items: center; font-size: 22px;
    }
    .header-action:hover { background: var(--brand-soft); }
    .header-logo { grid-column: 1 / 3; display: flex; align-items: center; gap: 9px; font-weight: 800; }
    .header-logo .mini-logo { width: 29px; height: 29px; border-radius: 10px; display: grid; place-items: center; color: #fff; background: var(--brand); font-size: 12px; }
    .header-loc { font-size: 10px; color: var(--muted); font-weight: 500; margin-top: 2px; }
    .header-more { justify-self: end; font-size: 18px; }

    #appContent {
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: smooth;
      scrollbar-width: none;
      background: #f5f8f7;
    }
    #appContent::-webkit-scrollbar { display: none; }
    .page { min-height: 100%; padding: 14px 14px 28px; animation: pageIn .22s ease both; }
    @keyframes pageIn { from { opacity: .2; transform: translateY(7px); } to { opacity: 1; transform: none; } }
    .page.edge { padding: 0 0 26px; }
    .page.edge .page-pad { padding: 0 14px; }

    .tabbar {
      flex: 0 0 67px;
      display: flex;
      align-items: stretch;
      background: rgba(255,255,255,.97);
      border-top: 1px solid var(--line);
      padding: 5px 5px 7px;
      position: relative; z-index: 8;
    }
    .tab-item {
      flex: 1; border: 0; background: transparent; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; color: #81928f; font-size: 9px; border-radius: 13px;
    }
    .tab-item.active { color: var(--brand); font-weight: 800; }
    .tab-glyph { width: 24px; height: 22px; display: grid; place-items: center; font-size: 15px; font-weight: 800; }
    .tab-item.active .tab-glyph { background: var(--brand-soft); border-radius: 8px; }

    .hero {
      margin: 2px 0 14px;
      min-height: 188px;
      padding: 22px 20px;
      border-radius: 24px;
      color: #fff;
      background:
        radial-gradient(circle at 80% 20%, rgba(255,255,255,.18), transparent 25%),
        radial-gradient(circle at 72% 88%, rgba(183,240,226,.28), transparent 30%),
        linear-gradient(140deg, #075e58, #0a8177 58%, #41a697);
      box-shadow: 0 15px 30px rgba(9, 104, 96, .2);
      position: relative; overflow: hidden;
    }
    .hero::after {
      content: ""; position: absolute; right: -28px; bottom: -47px;
      width: 154px; height: 154px; border: 1px solid rgba(255,255,255,.22);
      border-radius: 52% 48% 58% 42%; transform: rotate(18deg);
    }
    .hero-kicker { font-size: 10px; letter-spacing: .15em; color: rgba(255,255,255,.72); }
    .hero h2 { margin: 10px 0 8px; font-size: 25px; line-height: 1.3; letter-spacing: .02em; }
    .hero p { margin: 0; width: 75%; font-size: 11px; line-height: 1.75; color: rgba(255,255,255,.75); }
    .hero-btn {
      margin-top: 14px; border: 0; border-radius: 12px; background: #fff; color: var(--brand-dark);
      padding: 9px 14px; font-size: 11px; font-weight: 800; cursor: pointer;
      box-shadow: 0 8px 20px rgba(2,52,48,.18);
    }
    .hero-orbit {
      position: absolute; right: 17px; top: 44px; width: 88px; height: 88px;
      border-radius: 50%; border: 1px solid rgba(255,255,255,.26);
      display: grid; place-items: center;
    }
    .hero-orbit::before, .hero-orbit::after { content: ""; position: absolute; border-radius: 50%; border: 1px solid rgba(255,255,255,.16); }
    .hero-orbit::before { inset: 10px; }
    .hero-orbit::after { inset: 24px; background: rgba(255,255,255,.16); }
    .hero-drop { font-size: 26px; z-index: 1; }

    .quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 18px; }
    .quick-item {
      border: 0; background: transparent; cursor: pointer;
      padding: 2px 0; display: flex; flex-direction: column; align-items: center; gap: 7px;
      font-size: 10px; color: #39514e;
    }
    .quick-icon {
      width: 44px; height: 44px; border-radius: 16px;
      display: grid; place-items: center; font-size: 16px; font-weight: 800;
      background: #fff; color: var(--brand);
      box-shadow: 0 6px 18px rgba(17,76,71,.08);
    }
    .quick-item:nth-child(2) .quick-icon { color: var(--orange); background: var(--orange-soft); }
    .quick-item:nth-child(3) .quick-icon { color: #4b77b8; background: #eaf1fb; }
    .quick-item:nth-child(4) .quick-icon { color: #8364aa; background: #f1ebf7; }

    .section-head { display: flex; justify-content: space-between; align-items: end; margin: 16px 2px 10px; }
    .section-head h3 { margin: 0; font-size: 15px; }
    .section-head p { margin: 3px 0 0; font-size: 9px; color: var(--muted); }
    .text-link { border: 0; background: transparent; color: var(--brand); cursor: pointer; font-size: 10px; padding: 4px; }
    .product-search {
      display: flex; align-items: center; gap: 9px; margin-bottom: 13px; padding: 11px 13px;
      border: 1px solid var(--line); border-radius: 14px; background: #fff;
      box-shadow: 0 6px 18px rgba(18,70,66,.05); color: var(--muted);
    }
    .product-search input { min-width: 0; flex: 1; border: 0; outline: 0; padding: 0; background: transparent; color: var(--ink); font-size: 10px; }
    .product-search input::placeholder { color: #98a8a5; }
    .product-count { display: flex; justify-content: space-between; align-items: center; margin: 4px 2px 10px; color: var(--muted); font-size: 9px; }
    .product-count strong { color: var(--ink); font-size: 12px; }

    .card {
      background: #fff; border: 1px solid rgba(227,236,234,.8); border-radius: var(--radius);
      box-shadow: 0 7px 22px rgba(18,70,66,.06);
    }
    .product-card {
      width: 100%; border: 0; text-align: left; cursor: pointer;
      display: grid; grid-template-columns: 94px 1fr; gap: 13px;
      padding: 11px; margin-bottom: 10px; background: #fff; border-radius: 18px;
      box-shadow: 0 7px 22px rgba(18,70,66,.065);
    }
    .product-card:active { transform: scale(.99); }
    .product-art {
      height: 94px; border-radius: 15px; position: relative; overflow: hidden;
      display: grid; place-items: center;
      background: linear-gradient(145deg, #dcefeb, #f2faf8);
    }
    .product-art.orange { background: linear-gradient(145deg, #ffead9, #fff8f2); }
    .product-art.blue { background: linear-gradient(145deg, #dce8f7, #f5f8fc); }
    .kit-box {
      width: 58px; height: 67px; border-radius: 8px;
      background: #fff; box-shadow: 0 9px 18px rgba(27,77,73,.15);
      transform: rotate(-5deg); padding: 10px 7px; position: relative;
    }
    .kit-box::before { content: "ANPK"; color: var(--brand); font-weight: 900; font-size: 8px; letter-spacing: .08em; }
    .kit-box::after { content: ""; position: absolute; left: 7px; right: 7px; top: 30px; height: 18px; border-radius: 4px; background: var(--brand-soft); }
    .product-art.orange .kit-box::after { background: var(--orange-soft); }
    .product-art.blue .kit-box::after { background: #eaf1fb; }
    .product-tag { display: inline-block; margin-bottom: 5px; padding: 3px 7px; border-radius: 8px; color: var(--brand); background: var(--brand-soft); font-size: 8px; font-weight: 700; }
    .product-info h4 { margin: 0 0 5px; font-size: 13px; line-height: 1.4; }
    .product-info p { margin: 0; color: var(--muted); font-size: 9px; line-height: 1.55; }
    .price-row { display: flex; align-items: end; justify-content: space-between; margin-top: 10px; }
    .price { color: #d86631; font-weight: 900; font-size: 18px; }
    .price small { font-size: 10px; }
    .mini-buy { width: 26px; height: 26px; border-radius: 10px; display: grid; place-items: center; background: var(--brand); color: #fff; font-size: 15px; }

    .status-card { padding: 14px; margin-bottom: 10px; }
    .status-card-top { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
    .status-card h4 { margin: 0; font-size: 13px; }
    .status-card p { margin: 5px 0 0; font-size: 9px; line-height: 1.55; color: var(--muted); }
    .badge { display: inline-flex; align-items: center; justify-content: center; padding: 4px 8px; border-radius: 999px; font-size: 8px; font-weight: 800; white-space: nowrap; }
    .badge.green { color: var(--success); background: #e6f5ef; }
    .badge.orange { color: #b56b17; background: #fff3dd; }
    .badge.gray { color: #71817f; background: #edf1f0; }
    .badge.red { color: #c94b4b; background: #fceded; }
    .badge.blue { color: #486fa5; background: #eaf1fb; }

    .form-card { padding: 15px; margin-bottom: 12px; }
    .form-title { display: flex; align-items: center; gap: 8px; margin-bottom: 13px; font-size: 12px; font-weight: 800; }
    .form-num { width: 23px; height: 23px; border-radius: 8px; display: grid; place-items: center; color: #fff; background: var(--brand); font-size: 9px; }
    .field { display: block; margin: 11px 0; }
    .field > span { display: block; margin-bottom: 6px; color: #526865; font-size: 9px; font-weight: 700; }
    .field input, .field select, .field textarea {
      width: 100%; border: 1px solid var(--line); border-radius: 12px; background: #f8fbfa;
      padding: 11px 12px; color: var(--ink); font-size: 11px;
    }
    .field textarea { min-height: 70px; resize: vertical; line-height: 1.6; }
    .inline-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .choice-row { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .choice-card {
      border: 1px solid var(--line); background: #fff; border-radius: 14px; padding: 12px;
      cursor: pointer; text-align: left;
    }
    .choice-card.active { border-color: var(--brand); background: var(--brand-soft); box-shadow: inset 0 0 0 1px var(--brand); }
    .choice-card strong { display: block; font-size: 11px; }
    .choice-card small { display: block; color: var(--muted); margin-top: 5px; font-size: 8px; line-height: 1.5; }

    .btn {
      border: 0; border-radius: 13px; padding: 11px 16px; cursor: pointer;
      font-size: 11px; font-weight: 800; transition: .16s ease;
    }
    .btn:active { transform: scale(.98); }
    .btn.primary { background: var(--brand); color: #fff; box-shadow: 0 8px 18px rgba(10,112,105,.2); }
    .btn.secondary { color: var(--brand); background: var(--brand-soft); }
    .btn.orange { color: #fff; background: var(--orange); }
    .btn.ghost { color: var(--muted); background: #f0f4f3; }
    .btn.danger { color: var(--danger); background: #fceded; }
    .btn.full { width: 100%; }
    .btn:disabled { background: #dce4e2; color: #93a3a1; box-shadow: none; cursor: not-allowed; }
    .fixed-actions {
      position: sticky; bottom: 0; margin: 18px -14px -28px; padding: 12px 14px 15px;
      display: flex; gap: 9px; background: rgba(255,255,255,.96); border-top: 1px solid var(--line); z-index: 3;
    }
    .fixed-actions .btn { flex: 1; }

    .detail-cover {
      height: 226px; margin: 0; position: relative; overflow: hidden;
      display: grid; place-items: center;
      background: radial-gradient(circle at 50% 40%, #fff 0 22%, transparent 23%), linear-gradient(145deg, #d4ece7, #edf8f6);
    }
    .detail-cover .kit-box { width: 112px; height: 132px; border-radius: 14px; padding: 18px 14px; transform: rotate(-7deg); }
    .detail-cover .kit-box::before { font-size: 14px; }
    .detail-cover .kit-box::after { left: 14px; right: 14px; top: 57px; height: 35px; }
    .float-pill { position: absolute; right: 18px; top: 18px; padding: 6px 10px; background: rgba(255,255,255,.88); border-radius: 999px; color: var(--brand); font-size: 9px; font-weight: 800; }
    .detail-main { margin-top: -16px; position: relative; padding: 19px 16px; border-radius: 24px 24px 0 0; background: #fff; }
    .detail-main h2 { margin: 0 0 7px; font-size: 19px; }
    .detail-main .desc { color: var(--muted); font-size: 10px; line-height: 1.7; }
    .feature-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin: 16px 0; }
    .feature { text-align: center; padding: 11px 5px; border-radius: 13px; background: #f5f9f8; }
    .feature strong { display: block; font-size: 11px; }
    .feature span { font-size: 8px; color: var(--muted); }
    .detail-block { padding: 14px 0; border-top: 1px solid var(--line); }
    .detail-block h3 { margin: 0 0 8px; font-size: 12px; }
    .detail-block p, .detail-block li { font-size: 9px; color: var(--muted); line-height: 1.7; }
    .detail-block ul { padding-left: 17px; margin: 0; }

    .segmented { display: flex; padding: 3px; gap: 3px; background: #e9efed; border-radius: 13px; margin-bottom: 12px; }
    .segmented button { flex: 1; border: 0; padding: 8px 6px; border-radius: 10px; color: var(--muted); background: transparent; cursor: pointer; font-size: 10px; }
    .segmented button.active { background: #fff; color: var(--brand); box-shadow: 0 3px 10px rgba(25,65,61,.09); font-weight: 800; }
    .tabs-scroll { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; margin: 0 -14px 12px; padding: 0 14px; }
    .tabs-scroll::-webkit-scrollbar { display: none; }
    .filter-chip { border: 0; border-radius: 999px; padding: 7px 12px; background: #e9efed; color: var(--muted); white-space: nowrap; font-size: 9px; cursor: pointer; }
    .filter-chip.active { color: #fff; background: var(--brand); }

    .info-row { display: flex; justify-content: space-between; gap: 18px; padding: 9px 0; border-bottom: 1px solid #edf2f1; font-size: 10px; }
    .info-row:last-child { border-bottom: 0; }
    .info-row span { color: var(--muted); }
    .info-row strong { text-align: right; font-weight: 700; }
    .order-card { padding: 14px; margin-bottom: 10px; }
    .after-sale-entry {
      width: 100%; border: 0; padding: 13px 14px; margin-bottom: 10px;
      display: flex; align-items: center; gap: 11px; text-align: left; cursor: pointer;
      border-radius: 16px; color: var(--brand-dark); background: linear-gradient(145deg, #e4f4f1, #f4faf8);
      box-shadow: 0 7px 18px rgba(15, 91, 83, .07);
    }
    .after-sale-entry .menu-icon { flex: 0 0 auto; }
    .after-sale-entry strong { display: block; font-size: 11px; }
    .after-sale-entry small { display: block; margin-top: 3px; color: var(--muted); font-size: 8px; line-height: 1.5; }
    .after-sale-entry .menu-arrow { margin-left: auto; }
    .refund-amount { padding: 17px 0 7px; text-align: center; }
    .refund-amount span { display: block; color: var(--muted); font-size: 9px; }
    .refund-amount strong { display: block; margin-top: 5px; color: var(--danger); font-size: 25px; }
    .policy-list { margin: 7px 0 0; padding-left: 17px; color: var(--muted); font-size: 9px; line-height: 1.75; }
    .upload-box {
      width: 100%; min-height: 62px; margin: 2px 0 11px; border: 1px dashed #bdd4d0;
      border-radius: 13px; display: grid; place-items: center; align-content: center; gap: 4px;
      color: var(--brand); background: #f7fbfa; cursor: pointer;
    }
    .upload-box strong { font-size: 10px; }
    .upload-box span { color: var(--muted); font-size: 8px; }
    .order-head { display: flex; justify-content: space-between; align-items: center; font-size: 9px; color: var(--muted); padding-bottom: 10px; border-bottom: 1px solid var(--line); }
    .order-product { display: grid; grid-template-columns: 58px 1fr auto; gap: 10px; padding: 11px 0; }
    .order-thumb { width: 58px; height: 58px; border-radius: 13px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); font-size: 20px; font-weight: 900; }

      function renderQrCodes() {
        $$('.qr').forEach(qr => {
          const seed = [...(qr.dataset.code || 'ANPK')].reduce((a,c) => a + c.charCodeAt(0), 0);
          let html = '';
          for (let y = 0; y < 21; y++) {
            for (let x = 0; x < 21; x++) {
              const finder = (x < 7 && y < 7) || (x > 13 && y < 7) || (x < 7 && y > 13);
              let on;
              if (finder) {
                const lx = x > 13 ? x - 14 : x;
                const ly = y > 13 ? y - 14 : y;
                on = lx === 0 || lx === 6 || ly === 0 || ly === 6 || (lx >= 2 && lx <= 4 && ly >= 2 && ly <= 4);
              } else on = ((x * 17 + y * 31 + seed + x * y) % 7) < 3;
              html += `<i class="${on ? 'on' : ''}"></i>`;
            }
          }
          qr.innerHTML = html;
        });
      }
