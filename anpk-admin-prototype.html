<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安派科 · 运营管理后台原型</title>
  <style>
    :root {
      --brand: #0a746c;
      --brand-2: #159588;
      --brand-dark: #073f3c;
      --brand-deep: #102f2e;
      --brand-soft: #e7f6f2;
      --accent: #d5ee72;
      --canvas: #f3f6f5;
      --surface: #ffffff;
      --surface-2: #f8fbfa;
      --ink: #183331;
      --muted: #718481;
      --line: #e0e9e7;
      --line-strong: #cbd9d6;
      --orange: #e8873e;
      --orange-soft: #fff2e8;
      --red: #d95757;
      --red-soft: #fff0f0;
      --blue: #407dc6;
      --blue-soft: #edf4ff;
      --purple: #795bb7;
      --purple-soft: #f3effc;
      --shadow-sm: 0 7px 24px rgba(19, 62, 58, .06);
      --shadow: 0 22px 55px rgba(15, 56, 53, .14);
      --radius: 16px;
      --font: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-width: 1180px; min-height: 100%; }
    body { font-family: var(--font); color: var(--ink); background: var(--canvas); font-size: 14px; }
    button, input, select, textarea { font: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid rgba(10,116,108,.16); outline-offset: 2px; }
    .app { min-height: 100vh; }
    .sidebar { position: fixed; inset: 0 auto 0 0; width: 260px; z-index: 50; display: flex; flex-direction: column; color: #fff; background: linear-gradient(180deg, #102f2e 0%, #0a2827 100%); box-shadow: 10px 0 32px rgba(8,35,33,.09); }
    .brand { min-height: 82px; display: flex; align-items: center; gap: 12px; padding: 18px 20px; border-bottom: 1px solid rgba(255,255,255,.08); }
    .brand-mark { width: 42px; height: 42px; flex: 0 0 42px; display: grid; place-items: center; border-radius: 14px; color: #113d39; background: linear-gradient(145deg, #d9f281, #73d3bd); font-weight: 950; font-size: 18px; box-shadow: 0 10px 22px rgba(0,0,0,.22), inset 0 1px rgba(255,255,255,.55); }
    .brand strong { display: block; font-size: 15px; letter-spacing: .04em; }
    .brand small { display: block; margin-top: 4px; color: rgba(255,255,255,.48); font-size: 9px; letter-spacing: .14em; }
    .nav { flex: 1; overflow-y: auto; padding: 14px 12px 24px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent; }
    .nav-group { margin-bottom: 16px; }
    .nav-label { padding: 0 12px 7px; color: rgba(255,255,255,.35); font-size: 10px; font-weight: 800; letter-spacing: .15em; }
    .nav-item { width: 100%; min-height: 39px; display: flex; align-items: center; gap: 10px; margin: 2px 0; padding: 8px 10px; border: 0; border-radius: 11px; color: rgba(255,255,255,.7); background: transparent; cursor: pointer; text-align: left; transition: .17s ease; }
    .nav-item:hover { color: #fff; background: rgba(255,255,255,.07); transform: translateX(1px); }
    .nav-item.active { color: #fff; background: linear-gradient(90deg, rgba(106,206,186,.25), rgba(106,206,186,.08)); box-shadow: inset 3px 0 #d5ee72; }
    .nav-icon { width: 26px; height: 26px; flex: 0 0 26px; display: grid; place-items: center; border-radius: 8px; background: rgba(255,255,255,.07); font-size: 10px; font-weight: 900; }
    .nav-item.active .nav-icon { color: #0a4944; background: #bfe8a2; }
    .nav-text { flex: 1; font-size: 12px; }
    .nav-count { min-width: 19px; height: 19px; display: grid; place-items: center; padding: 0 5px; border-radius: 10px; color: #fff; background: var(--orange); font-size: 9px; font-weight: 900; }
    .sidebar-foot { padding: 13px 14px 16px; border-top: 1px solid rgba(255,255,255,.08); }
    .account { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 13px; background: rgba(255,255,255,.055); }
    .avatar { width: 34px; height: 34px; flex: 0 0 34px; display: grid; place-items: center; border-radius: 11px; color: #0b4a45; background: #bfe3d9; font-size: 11px; font-weight: 900; }
    .account-copy { flex: 1; min-width: 0; }
    .account strong { display: block; font-size: 11px; }
    .account small { color: rgba(255,255,255,.43); font-size: 9px; }
    .logout { border: 0; color: rgba(255,255,255,.5); background: transparent; cursor: pointer; font-size: 16px; }
    .main { min-height: 100vh; margin-left: 260px; width: calc(100% - 260px); }
    .content { width: min(1500px, 100%); margin: 0 auto; padding: 32px 38px 60px; }
    .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 28px; margin-bottom: 23px; }
    .page-kicker { margin-bottom: 7px; color: var(--brand); font-size: 10px; font-weight: 900; letter-spacing: .16em; }
    .page-head h1 { margin: 0; font-size: 28px; line-height: 1.18; letter-spacing: -.035em; }
    .page-head p { max-width: 760px; margin: 9px 0 0; color: var(--muted); line-height: 1.7; font-size: 12px; }
    .page-actions { display: flex; align-items: center; gap: 9px; padding-top: 5px; }
    .scope { display: flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: #fff; color: var(--muted); font-size: 11px; }
    .scope select { border: 0; outline: 0; color: var(--ink); background: transparent; font-weight: 700; }
    .btn { min-height: 38px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 14px; border: 1px solid transparent; border-radius: 10px; color: inherit; background: #fff; cursor: pointer; font-size: 12px; font-weight: 800; white-space: nowrap; transition: .16s ease; }
    .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
    .btn.primary { color: #fff; border-color: var(--brand); background: var(--brand); }
    .btn.primary:hover { background: var(--brand-dark); }
    .btn.secondary { color: var(--brand); border-color: #c7e6df; background: var(--brand-soft); }
    .btn.ghost { color: var(--ink); border-color: var(--line-strong); background: #fff; }
    .btn.danger { color: var(--red); border-color: #efcaca; background: var(--red-soft); }
    .btn.small { min-height: 30px; padding: 5px 9px; border-radius: 8px; font-size: 10px; }
    .btn.link { min-height: auto; padding: 2px; border: 0; color: var(--brand); background: transparent; }
    .card { border: 1px solid rgba(215,227,224,.92); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-sm); }
    .grid { display: grid; gap: 17px; }
    .cols-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
    .cols-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .cols-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .metric { position: relative; min-height: 124px; overflow: hidden; padding: 19px; }
    .metric::after { content: ""; position: absolute; top: -34px; right: -25px; width: 95px; height: 95px; border-radius: 50%; background: var(--brand-soft); }
    .metric.orange::after { background: var(--orange-soft); }
    .metric.blue::after { background: var(--blue-soft); }
    .metric.purple::after { background: var(--purple-soft); }
    .metric-top { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 11px; }
    .metric-icon { width: 31px; height: 31px; display: grid; place-items: center; border-radius: 10px; color: var(--brand); background: var(--brand-soft); font-size: 10px; font-weight: 900; }
    .metric.orange .metric-icon { color: var(--orange); background: var(--orange-soft); }
    .metric.blue .metric-icon { color: var(--blue); background: var(--blue-soft); }
    .metric.purple .metric-icon { color: var(--purple); background: var(--purple-soft); }
    .metric strong { display: block; margin-top: 17px; font-size: 28px; line-height: 1; letter-spacing: -.035em; }
    .metric small { display: block; margin-top: 7px; color: var(--muted); font-size: 10px; }
    .section { margin-top: 19px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 11px; }
    .section-head h2 { margin: 0; font-size: 16px; }
    .section-head p { margin: 4px 0 0; color: var(--muted); font-size: 10px; }
    .split { display: grid; grid-template-columns: minmax(0,1.55fr) minmax(300px,.78fr); gap: 17px; }
    .panel { padding: 20px; }
    .panel-title { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 17px; }
    .panel-title h3 { margin: 0; font-size: 14px; }
    .panel-title span { color: var(--muted); font-size: 10px; }
    .hero { position: relative; overflow: hidden; padding: 25px; color: #fff; border: 0; background: linear-gradient(120deg, #0a6f68, #154e4b); box-shadow: 0 19px 45px rgba(13,83,78,.17); }
    .hero::before, .hero::after { content: ""; position: absolute; border: 1px solid rgba(255,255,255,.12); border-radius: 50%; }
    .hero::before { width: 280px; height: 280px; top: -165px; right: -45px; }
    .hero::after { width: 140px; height: 140px; right: 110px; bottom: -105px; }
    .hero-inner { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 28px; }
    .hero-tag { display: inline-flex; padding: 5px 9px; border-radius: 12px; color: #efffd0; background: rgba(213,238,114,.14); font-size: 9px; font-weight: 900; }
    .hero h2 { margin: 12px 0 7px; font-size: 23px; }
    .hero p { margin: 0; color: rgba(255,255,255,.64); font-size: 11px; }
    .hero-stats { display: flex; gap: 30px; }
    .hero-stats strong { display: block; font-size: 23px; }
    .hero-stats small { color: rgba(255,255,255,.52); font-size: 9px; }
    .chart { height: 205px; display: flex; align-items: flex-end; gap: 10px; padding-top: 24px; border-bottom: 1px solid var(--line); }
    .bar-col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 7px; color: var(--muted); font-size: 9px; }
    .bar { width: min(28px,70%); min-height: 12px; border-radius: 7px 7px 2px 2px; background: linear-gradient(180deg, #61c8b4, #0b7b72); transition: .2s ease; }
    .bar-col:hover .bar { filter: brightness(.92); transform: translateY(-2px); }
    .task-list { display: grid; gap: 9px; }
    .task { display: flex; align-items: center; gap: 11px; min-height: 55px; padding: 10px 11px; border: 1px solid var(--line); border-radius: 12px; background: #fbfdfc; }
    .task-dot { width: 9px; height: 9px; flex: 0 0 9px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 0 5px rgba(232,135,62,.1); }
    .task-dot.red { background: var(--red); box-shadow: 0 0 0 5px rgba(217,87,87,.09); }
    .task-dot.blue { background: var(--blue); box-shadow: 0 0 0 5px rgba(64,125,198,.09); }
    .task-copy { flex: 1; }
    .task strong { display: block; font-size: 11px; }
    .task small { color: var(--muted); font-size: 9px; }
    .task b { font-size: 12px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 13px 15px; margin-bottom: 13px; }
    .filters { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
    .filter { padding: 7px 10px; border: 0; border-radius: 8px; color: var(--muted); background: transparent; cursor: pointer; font-size: 10px; font-weight: 800; }
    .filter.active { color: var(--brand); background: var(--brand-soft); }
    .search { width: 285px; height: 37px; display: flex; align-items: center; gap: 8px; padding: 0 11px; border: 1px solid var(--line-strong); border-radius: 10px; background: #fff; }
    .search span { color: #8ea19e; }
    .search input { min-width: 0; flex: 1; border: 0; outline: 0; color: var(--ink); background: transparent; font-size: 11px; }
    .table-card { overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th { padding: 12px 14px; border-bottom: 1px solid var(--line); color: var(--muted); background: #f7faf9; text-align: left; font-size: 9px; font-weight: 900; letter-spacing: .03em; }
    td { padding: 14px; border-bottom: 1px solid #edf2f1; vertical-align: middle; font-size: 11px; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #fbfdfc; }
    .cell-main { color: var(--ink); font-weight: 850; }
    .cell-sub { margin-top: 4px; color: var(--muted); font-size: 9px; }
    .table-actions { display: flex; align-items: center; gap: 6px; }
    .badge { min-height: 23px; display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 11px; color: var(--muted); background: #edf2f1; font-size: 9px; font-weight: 900; }
    .badge.green { color: #167b5e; background: #e7f6f0; }
    .badge.orange { color: #bd6828; background: var(--orange-soft); }
    .badge.red { color: var(--red); background: var(--red-soft); }
    .badge.blue { color: var(--blue); background: var(--blue-soft); }
    .badge.purple { color: var(--purple); background: var(--purple-soft); }
    .badge.outline { color: var(--brand); border: 1px solid #c0dfd9; background: #fff; }
    .service-tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .detail-layout { display: grid; grid-template-columns: minmax(0,1fr) 350px; gap: 17px; align-items: start; }
    .detail-card { padding: 20px; margin-bottom: 15px; }
    .detail-title { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 5px; padding-bottom: 13px; border-bottom: 1px solid var(--line); }
    .detail-title h3 { margin: 0; font-size: 14px; }
    .info-row { min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 20px; border-bottom: 1px solid #edf2f1; font-size: 11px; }
    .info-row:last-child { border-bottom: 0; }
    .info-row > span { color: var(--muted); }
    .info-row > strong { max-width: 65%; text-align: right; }
    .sticky { position: sticky; top: 22px; }
    .service-card { display: flex; align-items: center; gap: 13px; padding: 16px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface-2); }
    .service-card + .service-card { margin-top: 10px; }
    .service-icon { width: 41px; height: 41px; flex: 0 0 41px; display: grid; place-items: center; border-radius: 13px; color: var(--brand); background: var(--brand-soft); font-size: 10px; font-weight: 900; }
    .service-icon.blue { color: var(--blue); background: var(--blue-soft); }
    .service-copy { flex: 1; }
    .service-copy strong { display: block; font-size: 12px; }
    .service-copy small { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; }
    .timeline { padding: 4px 0; }
    .timeline-item { position: relative; min-height: 60px; display: grid; grid-template-columns: 27px 1fr; gap: 10px; }
    .timeline-item::after { content: ""; position: absolute; left: 13px; top: 26px; bottom: -2px; width: 2px; background: var(--line); }
    .timeline-item:last-child::after { display: none; }
    .timeline-dot { z-index: 1; width: 27px; height: 27px; display: grid; place-items: center; border: 4px solid #fff; border-radius: 50%; color: #879995; background: #edf2f1; box-shadow: 0 0 0 1px var(--line); font-size: 8px; font-weight: 900; }
    .timeline-item.done .timeline-dot { color: #fff; background: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
    .timeline-item.current .timeline-dot { color: #fff; background: var(--orange); box-shadow: 0 0 0 4px rgba(232,135,62,.12); }
    .timeline-copy { padding: 3px 0 13px; }
    .timeline-copy strong { display: block; font-size: 11px; }
    .timeline-copy small { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; }
    .notice { padding: 13px 15px; border: 1px solid #f0dbb2; border-radius: 12px; color: #77531b; background: #fff7e8; line-height: 1.65; font-size: 10px; }
    .notice strong { display: block; margin-bottom: 2px; color: #694814; font-size: 11px; }
    .notice.green { border-color: #c9e5dd; color: #3f7067; background: #edf8f5; }
    .notice.green strong { color: var(--brand); }
    .notice.red { border-color: #efcccc; color: #925353; background: var(--red-soft); }
    .notice.red strong { color: var(--red); }
    .notice.blue { border-color: #ccdcf1; color: #4c6e98; background: var(--blue-soft); }
    .notice.blue strong { color: var(--blue); }
    .field { display: block; margin-bottom: 14px; }
    .field > span { display: block; margin-bottom: 6px; color: var(--muted); font-size: 10px; font-weight: 800; }
    .field input, .field select, .field textarea { width: 100%; padding: 10px 11px; border: 1px solid var(--line-strong); border-radius: 10px; outline: 0; color: var(--ink); background: #fff; font-size: 11px; transition: .15s ease; }
    .field input, .field select { height: 39px; }
    .field textarea { min-height: 76px; resize: vertical; line-height: 1.55; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: #6abcae; box-shadow: 0 0 0 3px rgba(10,116,108,.08); }
    .field-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 0 13px; }
    .check-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; margin-bottom: 15px; }
    .check-card { display: flex; align-items: flex-start; gap: 9px; padding: 12px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface-2); }
    .check-card input { margin-top: 2px; accent-color: var(--brand); }
    .check-card strong { display: block; font-size: 11px; }
    .check-card small { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; line-height: 1.45; }
    .product-cell { display: flex; align-items: center; gap: 11px; min-width: 230px; }
    .product-thumb { width: 48px; height: 48px; flex: 0 0 48px; display: grid; place-items: center; overflow: hidden; border: 1px solid #cfe2de; border-radius: 12px; color: var(--brand); background: linear-gradient(145deg,#edf8f5,#dcefea); font-size: 10px; font-weight: 900; }
    .product-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .price-stack strong { display: block; font-size: 12px; }
    .price-stack small { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; }
    .upload-grid { display: grid; grid-template-columns: minmax(0,.75fr) minmax(0,1.25fr); gap: 14px; margin-bottom: 15px; }
    .upload-group > span { display: block; margin-bottom: 7px; color: var(--muted); font-size: 10px; font-weight: 800; }
    .upload-box { min-height: 142px; display: grid; place-items: center; overflow: hidden; padding: 12px; border: 1px dashed #a9ccc5; border-radius: 12px; color: var(--muted); background: #f7fbfa; cursor: pointer; text-align: center; transition: .16s ease; }
    .upload-box:hover { border-color: var(--brand); background: var(--brand-soft); }
    .upload-box strong { display: block; margin-top: 7px; color: var(--ink); font-size: 11px; }
    .upload-box small { display: block; margin-top: 4px; font-size: 9px; line-height: 1.45; }
    .upload-mark { width: 48px; height: 48px; display: grid; place-items: center; margin: 0 auto; border-radius: 14px; color: var(--brand); background: #e2f2ee; font-size: 18px; font-weight: 900; }
    .upload-box img { width: 100%; height: 118px; border-radius: 9px; object-fit: cover; }
    .upload-input { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }
    .detail-preview { min-height: 142px; display: flex; align-items: center; flex-wrap: wrap; gap: 9px; padding: 12px; border: 1px dashed #a9ccc5; border-radius: 12px; background: #f7fbfa; }
    .detail-thumb { width: 72px; height: 82px; display: grid; place-items: center; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; color: var(--brand); background: #eaf5f2; font-size: 9px; font-weight: 900; }
    .detail-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .upload-add { width: 72px; height: 82px; display: grid; place-items: center; border: 1px dashed #a9ccc5; border-radius: 10px; color: var(--brand); background: #fff; cursor: pointer; font-size: 20px; font-weight: 900; }
    .settings-wide { grid-column: 1 / -1; }
    .agreement-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 14px; }
    .editor-box { padding: 15px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface-2); }
    .editor-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .editor-head strong { font-size: 12px; }
    .editor-head small { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; }
    .editor-box textarea { width: 100%; min-height: 190px; padding: 12px; border: 1px solid var(--line-strong); border-radius: 10px; outline: 0; color: var(--ink); background: #fff; resize: vertical; line-height: 1.7; font: inherit; font-size: 10px; }
    .editor-box textarea:focus { border-color: #6abcae; box-shadow: 0 0 0 3px rgba(10,116,108,.08); }
    .copy-list { display: grid; gap: 11px; }
    .copy-item { display: grid; grid-template-columns: 190px minmax(0,1fr); gap: 15px; align-items: start; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); }
    .copy-item strong { display: block; font-size: 11px; }
    .copy-item small { display: block; margin-top: 4px; color: var(--muted); font-size: 9px; line-height: 1.5; }
    .copy-item textarea { width: 100%; min-height: 68px; padding: 10px 11px; border: 1px solid var(--line-strong); border-radius: 10px; outline: 0; color: var(--ink); background: #fff; resize: vertical; line-height: 1.6; font: inherit; font-size: 10px; }
    .switch { width: 46px; height: 26px; flex: 0 0 46px; padding: 3px; border: 0; border-radius: 14px; background: #c9d4d2; cursor: pointer; transition: .18s ease; }
    .switch::after { content: ""; display: block; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.18); transition: .18s ease; }
    .switch.on { background: var(--brand); }
    .switch.on::after { transform: translateX(20px); }
    .pagination { display: flex; align-items: center; justify-content: flex-end; gap: 6px; padding: 13px 15px; border-top: 1px solid var(--line); color: var(--muted); font-size: 9px; }

      function updateNav(){ document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.page===activeNav())); $('#applicationCount').textContent=state.applications.filter(x=>x.status==='待联系').length; $('#shippingCount').textContent=state.orders.filter(x=>x.status==='待发货').length; $('#refundCount').textContent=state.orders.filter(x=>x.status==='退款申请').length; $('#anomalyCount').textContent=state.bloodForms.filter(x=>x.status==='样本异常').length; }

      function showModal(title,body,foot='',wide=false){ $('#modalTitle').textContent=title; $('#modalBody').innerHTML=body; $('#modalFoot').innerHTML=foot||`<button class="btn ghost" data-action="close-modal">关闭</button>`; $('#modal').classList.toggle('wide',wide); modalLayer.classList.add('open'); modalLayer.setAttribute('aria-hidden','false'); }

      function productModal(id=''){ const x=state.products.find(p=>p.id===id); showModal(x?'编辑套餐商品':'创建套餐商品',`<label class="field"><span>套餐名称 *</span><input id="productName" value="${esc(x?.name||'肠道健康检测套餐')}"></label><div class="field-grid"><label class="field"><span>展示价格 *</span><input id="productDisplayPrice" type="number" min="0.01" value="${x?.displayPrice||699}"></label><label class="field"><span>销售价格 *</span><input id="productPrice" type="number" min="0.01" value="${x?.price||599}"></label></div><div class="field-grid"><label class="field"><span>排序值 *</span><input id="productSort" type="number" min="0" step="1" value="${x?.sort??100}"></label><label class="field"><span>商品状态</span><select id="productStatus"><option ${x?.status!=='停用'?'selected':''}>上架</option><option ${x?.status==='停用'?'selected':''}>停用</option></select></label></div><div class="notice blue" style="margin-bottom:14px"><strong>前台展示规则</strong>未登录展示 ${money(x?.displayPrice||699)}，登录后展示 ${money(x?.price||599)}；排序值越小越靠前。</div><div class="upload-grid"><div class="upload-group"><span>商品主图 *</span><label class="upload-box" for="productMainImage"><input class="upload-input" id="productMainImage" type="file" accept="image/png,image/jpeg,image/webp"><span id="mainImagePreview">${x?.mainImage?'<span class="upload-mark">图</span><strong>主图已上传</strong><small>点击可重新选择，建议 1:1</small>':'<span class="upload-mark">＋</span><strong>上传商品主图</strong><small>支持 JPG、PNG、WebP</small>'}</span></label></div><div class="upload-group"><span>商品详情图 *</span><div class="detail-preview" id="detailImagePreview">${Array.from({length:x?.detailImages||0},(_,i)=>`<span class="detail-thumb">详情图 ${i+1}</span>`).join('')}<label class="upload-add" for="productDetailImages">＋<input class="upload-input" id="productDetailImages" type="file" accept="image/png,image/jpeg,image/webp" multiple></label></div></div></div><label class="field"><span>检测内容说明 *</span><textarea id="productDesc">${esc(x?.desc||'用于说明该套餐对应的检测范围和报告维度')}</textarea></label><div class="notice green"><strong>实物交付统一</strong>每购买一份套餐固定消耗一个通用采集盒，套餐差异体现在价格、展示素材和后续检测内容。</div>`,`<button class="btn ghost" data-action="close-modal">取消</button><button class="btn primary" data-action="save-product" data-id="${id}">保存商品</button>`,true); }
      function shipModal(id){ const x=state.orders.find(o=>o.id===id); showModal('登记快递发货',`<div class="info-row"><span>订单编号</span><strong>${x.id}</strong></div><div class="info-row"><span>商品数量</span><strong>${esc(x.product)} × ${x.qty}</strong></div><div class="info-row" style="margin-bottom:14px"><span>收货用户</span><strong>${esc(x.user)} · ${esc(x.phone)}</strong></div><div class="field-grid"><label class="field"><span>快递公司 *</span><select id="shipCompany"><option>顺丰速运</option><option>京东物流</option><option>中通快递</option></select></label><label class="field"><span>物流单号 *</span><input id="shipNo" value="SF1492863108"></label></div><div class="notice blue"><strong>权益解锁节点</strong>发货后用户仍不能创建采血单，需在小程序确认收货后按套餐数量生成权益。</div>`,`<button class="btn ghost" data-action="close-modal">取消</button><button class="btn primary" data-action="confirm-ship" data-id="${id}">确认发货</button>`); }

      document.addEventListener('click', event => {
        const el=event.target.closest('[data-page],[data-action]'); if(!el)return;
        if(el.dataset.page)return go(el.dataset.page);
        const a=el.dataset.action;
        if(a==='close-modal')return closeModal();
        if(a==='logout'){ $('#loginScreen').classList.add('open'); return; }
        if(a==='login'){ if(!$('#loginAccount').value||!$('#loginPassword').value)return toast('请输入账号和密码'); $('#loginScreen').classList.remove('open'); return toast('登录成功，欢迎回来'); }
        if(a==='refresh')return toast('数据已更新至刚刚');
        if(a==='export')return toast('已生成演示导出任务');
        if(a==='open-create-operator')return createOperatorModal(el.dataset.type);

        if(a==='view-operator'){ const list=el.dataset.type==='province'?state.provinces:state.cities,x=list.find(v=>v.id===el.dataset.id); return showModal('运营主体详情',`<div class="info-row"><span>主体名称</span><strong>${esc(x.name)}</strong></div><div class="info-row"><span>区域归属</span><strong>${esc(x.province+(x.city?' / '+x.city:''))}</strong></div><div class="info-row"><span>负责人</span><strong>${esc(x.leader)} · ${esc(x.phone)}</strong></div><div class="info-row"><span>数据权限</span><strong>${x.city?'仅本城市':'仅本省'}</strong></div><div class="notice blue" style="margin-top:14px"><strong>当前原型权限</strong>区域运营角色以辖区数据查看为主，具体业务操作权限等待后续确认。</div>`); }
        if(a==='toggle-operator'){ const list=el.dataset.type==='province'?state.provinces:state.cities,x=list.find(v=>v.id===el.dataset.id); x.status=x.status==='启用'?'停用':'启用'; addLog('区域组织',x.status+'运营主体',x.name); render(false); return toast(`已${x.status}${x.name}`); }
        if(a==='view-application'){ const x=state.applications.find(v=>v.id===el.dataset.id); return showModal('入驻申请详情',`<div class="info-row"><span>申请编号</span><strong>${x.id}</strong></div><div class="info-row"><span>拟合作站</span><strong>${esc(x.name)}</strong></div><div class="info-row"><span>申请人</span><strong>${esc(x.applicant)} · ${esc(x.phone)}</strong></div><div class="info-row"><span>归属地区</span><strong>${esc(x.city)}</strong></div><div class="info-row"><span>申请服务</span><strong>${esc(x.service)}</strong></div><div class="info-row"><span>申请时间</span><strong>${x.time}</strong></div><div class="notice" style="margin-top:14px"><strong>线下核实后建站</strong>该页面仅记录申请线索，不做线上自动审核开通。</div>`,x.status==='待联系'?`<button class="btn ghost" data-action="close-modal">关闭</button><button class="btn primary" data-action="convert-application" data-id="${x.id}">创建合作站</button>`:''); }
        if(a==='convert-application'){ closeModal(); return createStationModal(el.dataset.id); }
        if(a==='open-create-station')return createStationModal();
        if(a==='confirm-create-station'){ const name=$('#stationName').value.trim(),health=$('#serviceHealth').checked,blood=$('#serviceBlood').checked; if(!name)return toast('请填写站点名称'); if(!health&&!blood)return toast('至少开通一项服务'); const id='ST'+Date.now().toString().slice(-9); state.stations.unshift({id,name,city:$('#stationProvince').value+' / '+$('#stationCity').value,address:$('#stationAddress').value,contact:$('#stationContact').value+' '+$('#stationPhone').value.replace(/(\d{3})\d{4}(\d{4})/,'$1****$2'),health,blood,status:'启用',admin:'ST'+Date.now().toString().slice(-8),workers:0,created:'2026-08-26'}); const app=state.applications.find(x=>x.id===el.dataset.app); if(app)app.status='已建站'; addLog('社区合作站','创建合作站',name); closeModal(); state.selectedStation=id; go('station-detail'); return toast('合作站与管理员账号已创建'); }
        if(a==='view-station'){ state.selectedStation=el.dataset.id; return go('station-detail'); }
        if(a==='toggle-station-service'){ const x=state.stations.find(v=>v.id===el.dataset.id),key=el.dataset.service,turnOff=x[key]; if(turnOff)return showModal(`停用${key==='health'?'健康服务':'采血服务'}`,`<div class="confirm-icon">!</div><div class="modal-copy">停用后不再接收新的${key==='health'?'自提订单':'采血单绑定'}，已经产生的业务仍允许继续处理完成。</div>`,`<button class="btn ghost" data-action="close-modal">取消</button><button class="btn danger" data-action="confirm-toggle-service" data-id="${x.id}" data-service="${key}">确认停用</button>`); x[key]=true; addLog('社区合作站','开通服务',x.name); render(false); return toast('服务已开通'); }
        if(a==='confirm-toggle-service'){ const x=state.stations.find(v=>v.id===el.dataset.id); x[el.dataset.service]=false; addLog('社区合作站','停用服务',x.name); closeModal(); render(false); return toast('服务已停用，存量业务可继续处理'); }
        if(a==='reset-station-password'||a==='reset-collab'||a==='reset-admin')return showModal('确认重置密码',`<div class="confirm-icon">钥</div><div class="modal-copy">重置后原密码立即失效，系统将生成新的临时密码，请通过安全方式提供给账号使用人。</div>`,`<button class="btn ghost" data-action="close-modal">取消</button><button class="btn primary" data-action="confirm-reset-password">确认重置</button>`);

        if(a==='edit-station')return toast('站点资料编辑表单已进入演示状态');
        if(a==='open-create-product')return productModal();
        if(a==='edit-product')return productModal(el.dataset.id);
        if(a==='save-product'){ const x=state.products.find(p=>p.id===el.dataset.id),name=$('#productName').value.trim(),displayPrice=Number($('#productDisplayPrice').value),price=Number($('#productPrice').value),sort=Number($('#productSort').value),mainImage=Boolean($('#productMainImage').files.length||x?.mainImage),detailImages=$('#productDetailImages').files.length||x?.detailImages||0; if(!name||displayPrice<=0||price<=0||!Number.isInteger(sort)||sort<0)return toast('请填写正确的名称、价格和排序值'); if(!mainImage)return toast('请上传商品主图'); if(!detailImages)return toast('请至少上传一张商品详情图'); if(x){x.name=name;x.displayPrice=displayPrice;x.price=price;x.sort=sort;x.status=$('#productStatus').value;x.desc=$('#productDesc').value;x.mainImage=mainImage;x.detailImages=detailImages;}else state.products.push({id:'SP'+Date.now().toString().slice(-4),name,displayPrice,price,sort,sales:0,status:$('#productStatus').value,desc:$('#productDesc').value,mainImage,detailImages}); addLog('套餐商品',x?'编辑商品':'创建商品',`${name} · 排序 ${sort}`); closeModal(); render(false); return toast('套餐商品已保存并更新排序'); }
        if(a==='toggle-product'){ const x=state.products.find(p=>p.id===el.dataset.id); x.status=x.status==='上架'?'停用':'上架'; addLog('套餐商品',x.status,x.name); render(false); return toast(`商品已${x.status}`); }
        if(a==='delete-product'){ const x=state.products.find(p=>p.id===el.dataset.id); return showModal('删除套餐商品',`<div class="confirm-icon">!</div><div class="modal-copy"><strong style="display:block;margin-bottom:6px;color:var(--ink);font-size:13px">${esc(x.name)}</strong>删除后该商品将从后台商品列表和小程序商品列表中移除，此操作不能撤销。</div><div class="notice red" style="margin-top:14px"><strong>历史数据不会被删除</strong>既有订单、套餐卡、采血单和报告继续保留成交时的商品名称与价格快照。</div>`,`<button class="btn ghost" data-action="close-modal">取消</button><button class="btn danger" data-action="confirm-delete-product" data-id="${x.id}">确认删除</button>`); }
        if(a==='confirm-delete-product'){ const index=state.products.findIndex(p=>p.id===el.dataset.id),name=state.products[index]?.name; if(index<0)return; state.products.splice(index,1); addLog('套餐商品','删除商品',name); closeModal(); render(false); return toast('套餐商品已删除'); }
        if(a==='view-order'){ state.selectedOrder=el.dataset.id; return go('order-detail'); }
        if(a==='open-ship')return shipModal(el.dataset.id);
        if(a==='confirm-ship'){ const x=state.orders.find(o=>o.id===el.dataset.id),no=$('#shipNo').value.trim(); if(!no)return toast('请填写物流单号'); x.status='已发货';x.logistics=$('#shipCompany').value+' '+no; addLog('订单中心','登记发货',x.id+' · '+x.logistics); closeModal(); render(false); return toast('发货成功，物流信息已同步用户'); }
        if(a==='review-refund')return refundModal(el.dataset.id);
        if(a==='approve-refund'){ const x=state.orders.find(o=>o.id===el.dataset.id); x.status='已退款'; addLog('退款处理','同意退款',x.id); closeModal(); state.page='refunds'; render(false); return toast('退款已通过，核销码失效'); }
        if(a==='reject-refund'){ const x=state.orders.find(o=>o.id===el.dataset.id); x.status='待核销'; addLog('退款处理','拒绝退款',x.id); closeModal(); state.page='refunds'; render(false); return toast('已拒绝退款，订单恢复待核销'); }
        if(a==='open-create-batch')return batchModal();
        if(a==='confirm-create-batch'){ const qty=Number($('#batchQty').value),product=$('#batchProduct').value; if(!Number.isInteger(qty)||qty<1||qty>1000)return toast('生成数量应为 1—1000'); const id='PC'+Date.now().toString().slice(-10); state.batches.unshift({id,product,qty,unused:qty,creator:'总部超级管理员',time:now()}); state.cards.unshift({id:'APKC-'+Date.now().toString().slice(-10),password:'7N2K9P',product,batch:id,status:'未使用',used:'—',blood:'—'}); addLog('套餐卡','生成卡密批次',id+' · '+qty+' 组'); closeModal(); render(false); return toast(`已生成 ${qty} 组一次性套餐卡`); }
        if(a==='view-batch'){ state.page='cards'; render(); return toast('已按批次筛选套餐卡'); }
        if(a==='show-card'){ const x=state.cards.find(c=>c.id===el.dataset.id); return showModal('查看套餐卡密',`<div class="notice green"><strong>请妥善保管</strong>系统不记录该卡密的线下发放去向。</div><div class="info-row" style="margin-top:12px"><span>卡号</span><strong>${x.id}</strong></div><div class="info-row"><span>密码</span><strong style="font-size:18px;letter-spacing:.15em;color:var(--brand)">${x.password}</strong></div><div class="info-row"><span>关联套餐</span><strong>${esc(x.product)}</strong></div>`); }
        if(a==='jump-blood'){ const x=state.bloodForms.find(b=>b.id===el.dataset.id); if(x){state.selectedBlood=x.id;return go('blood-detail');} return toast('已定位关联采血单'); }
        if(a==='view-blood'){ state.selectedBlood=el.dataset.id; return go('blood-detail'); }
        if(a==='contact-user'){ addLog('样本异常','登记客服联系',state.selectedBlood); return toast('已登记：客服完成首次联系'); }
        if(a==='view-report'){ return showModal('检测报告预览',`<div style="min-height:340px;display:grid;place-items:center;border:1px solid var(--line);border-radius:13px;background:#f8fbfa"><div style="text-align:center"><div style="width:64px;height:76px;margin:0 auto 13px;display:grid;place-items:center;border-radius:10px;color:var(--red);background:#fff0f0;font-weight:900">PDF</div><strong style="display:block">安派科健康检测报告</strong><small style="display:block;margin-top:6px;color:var(--muted)">原型中仅模拟 PDF 文件预览</small></div></div>`,`<button class="btn ghost" data-action="close-modal">关闭</button><button class="btn primary" data-action="download-demo">下载 PDF</button>`,true); }
        if(a==='download-demo')return toast('已开始下载演示报告');
        if(a==='report-versions'){ const x=state.reports.find(r=>r.id===el.dataset.id); return showModal('报告版本记录',`<div class="timeline"><div class="timeline-item done"><span class="timeline-dot">✓</span><span class="timeline-copy"><strong>v${x.version} 当前有效版本</strong><small>${x.time} · 数据中心报告账号上传</small></span></div>${x.version>1?'<div class="timeline-item done"><span class="timeline-dot">✓</span><span class="timeline-copy"><strong>v1 历史版本</strong><small>2026-08-25 16:08 · 已被替换，文件永久保留</small></span></div>':''}</div><div class="notice green"><strong>版本审计规则</strong>用户仅查看当前有效报告，后台保留全部历史 PDF、操作账号与替换时间。</div>`); }
        if(a==='view-user'){ const x=state.users.find(u=>u.id===el.dataset.id); return showModal('用户详情',`<div class="info-row"><span>用户</span><strong>${esc(x.name)} · ${x.phone}</strong></div><div class="info-row"><span>所属城市</span><strong>${x.city}</strong></div><div class="info-row"><span>累计订单</span><strong>${x.orders} 笔</strong></div><div class="info-row"><span>创建采血单</span><strong>${x.blood} 张</strong></div><div class="info-row"><span>工作人员身份</span><strong>${esc(x.worker)}</strong></div><div class="notice blue" style="margin-top:14px"><strong>用户与受检人相互独立</strong>该用户购买的套餐可以为家人或其他人创建采血单，报告归属实际受检人。</div>`); }
        if(a==='open-create-collab')return showModal('创建检测协作账号',`<label class="field"><span>账号名称 *</span><input id="collabName" value="实验室备用账号"></label><div class="field-grid"><label class="field"><span>角色 *</span><select id="collabRole"><option>实验室</option><option>数据中心</option></select></label><label class="field"><span>登录账号 *</span><input id="collabAccount" value="lab_backup"></label></div><div class="notice blue"><strong>菜单权限自动隔离</strong>实验室可录入数据和标记异常；数据中心可查看数据并上传报告。</div>`,`<button class="btn ghost" data-action="close-modal">取消</button><button class="btn primary" data-action="confirm-create-collab">创建账号</button>`);
        if(a==='confirm-create-collab'){ const name=$('#collabName').value.trim(),role=$('#collabRole').value,account=$('#collabAccount').value.trim(); if(!name||!account)return toast('请填写完整账号信息'); state.collaboration.push({id:'AC-'+Date.now().toString().slice(-6),name,role,account,scope:role==='实验室'?'全部已寄出采血单':'待出报告采血单',status:'启用',last:'尚未登录'}); addLog('检测协作账号','创建账号',name); closeModal(); render(false); return toast('检测协作账号已创建'); }
        if(a==='toggle-collab'){ const x=state.collaboration.find(v=>v.id===el.dataset.id); x.status=x.status==='启用'?'停用':'启用'; render(false); return toast(`账号已${x.status}`); }
        if(a==='toggle-sms-service'){ state.settings.smsEnabled=!state.settings.smsEnabled; render(false); return toast(state.settings.smsEnabled?'腾讯云短信服务已启用':'腾讯云短信服务已停用'); }
        if(a==='open-sms-test'){ return showModal('发送测试短信',`<div class="notice blue" style="margin-bottom:14px"><strong>验证当前页面中的短信配置</strong>系统将使用验证码模板向下方手机号发送一条测试短信。</div><label class="field"><span>测试手机号 *</span><input id="smsTestPhone" maxlength="11" value="13812345678"></label>`,`<button class="btn ghost" data-action="close-modal">取消</button><button class="btn primary" data-action="confirm-sms-test">发送测试</button>`); }
        if(a==='confirm-sms-test'){ const phone=$('#smsTestPhone').value.trim(),configured=$('#smsSecretId')?.value.trim()&&$('#smsSecretKey')?.value.trim()&&$('#smsSdkAppId')?.value.trim()&&$('#smsSign')?.value.trim()&&$('#smsVerifyTemplate')?.value.trim(); if(!/^1\d{10}$/.test(phone))return toast('请输入正确的测试手机号'); if(!configured)return toast('请先完整填写腾讯云短信配置'); closeModal(); addLog('业务参数','发送测试短信',phone.replace(/(\d{3})\d{4}(\d{4})/,'$1****$2')); return toast('测试短信已发送，请注意查收'); }
        if(a==='preview-agreement'){ const privacy=el.dataset.type==='privacy',content=$(privacy?'#privacyAgreement':'#serviceAgreement').value; return showModal(privacy?'隐私保护指引预览':'用户服务协议预览',`<div style="padding:4px 2px;white-space:pre-wrap;line-height:1.9;color:var(--ink);font-size:11px">${esc(content)}</div>`,`<button class="btn primary" data-action="close-modal">关闭预览</button>`,true); }
        if(a==='save-settings'){ const timeout=Number($('#payTimeout').value),smsFields=[$('#smsSecretId').value.trim(),$('#smsSecretKey').value.trim(),$('#smsSdkAppId').value.trim(),$('#smsSign').value.trim(),$('#smsVerifyTemplate').value.trim()],agreements=[$('#privacyAgreement').value.trim(),$('#serviceAgreement').value.trim()],copyFields=[$('#productWarmTip').value.trim(),$('#coldChainTip').value.trim(),$('#reportQueryTip').value.trim(),$('#offHoursTip').value.trim()]; if(timeout<5||timeout>120)return toast('订单关闭时长应为 5—120 分钟'); if(state.settings.smsEnabled&&smsFields.some(v=>!v))return toast('请完整填写腾讯云短信配置'); if(agreements.some(v=>!v))return toast('隐私保护指引和用户服务协议不能为空'); if(copyFields.some(v=>!v))return toast('小程序文案配置不能为空'); state.settings.payTimeout=timeout;state.settings.supportPhone=$('#supportPhone').value.trim();[state.settings.smsSecretId,state.settings.smsSecretKey,state.settings.smsSdkAppId,state.settings.smsSign,state.settings.smsVerifyTemplate]=smsFields;[state.settings.privacyAgreement,state.settings.serviceAgreement]=agreements;[state.settings.productWarmTip,state.settings.coldChainTip,state.settings.reportQueryTip,state.settings.offHoursTip]=copyFields;addLog('业务参数','更新全局配置','短信、协议与小程序文案已更新');return toast('业务参数已保存并同步小程序配置'); }
        if(a==='open-create-admin')return showModal('创建后台账号',`<label class="field"><span>账号名称 *</span><input id="adminName" value="客服运营"></label><div class="field-grid"><label class="field"><span>角色 *</span><select id="adminRole"><option>订单与售后</option><option>总部只读</option><option>省级运营</option><option>城市合伙人</option></select></label><label class="field"><span>数据范围 *</span><select id="adminScope"><option>全国</option><option>广东省</option><option>广州市</option></select></label></div><label class="field"><span>登录账号 *</span><input id="adminAccount" value="service@anpuke.com"></label>`,`<button class="btn ghost" data-action="close-modal">取消</button><button class="btn primary" data-action="confirm-create-admin">创建账号</button>`);
        if(a==='confirm-create-admin'){ const name=$('#adminName').value.trim(),account=$('#adminAccount').value.trim(); if(!name||!account)return toast('请填写完整账号信息'); state.admins.push({id:'AD'+Date.now().toString().slice(-4),name,role:$('#adminRole').value,scope:$('#adminScope').value,account,status:'启用',last:'尚未登录'}); addLog('后台账号','创建账号',name); closeModal(); render(false); return toast('后台账号已创建'); }
        if(a==='toggle-admin'){ const x=state.admins.find(v=>v.id===el.dataset.id); x.status=x.status==='启用'?'停用':'启用'; render(false); return toast(`账号已${x.status}`); }
      });

      document.addEventListener('change', event => {
        if(event.target.matches('[data-action="change-scope"]')){state.scope=event.target.value;toast(`数据范围已切换为${state.scope}`);render(false);}
        if(event.target.id==='productMainImage'&&event.target.files[0]){const file=event.target.files[0],reader=new FileReader();reader.onload=()=>{$('#mainImagePreview').innerHTML=`<img src="${reader.result}" alt="商品主图预览"><strong>${esc(file.name)}</strong><small>已选择新的商品主图</small>`;};reader.readAsDataURL(file);}
        if(event.target.id==='productDetailImages'&&event.target.files.length){const host=$('#detailImagePreview'),add=host.querySelector('.upload-add');host.querySelectorAll('.detail-thumb').forEach(node=>node.remove());[...event.target.files].slice(0,8).forEach((file,index)=>{const thumb=document.createElement('span'),reader=new FileReader();thumb.className='detail-thumb';thumb.textContent=`详情图 ${index+1}`;host.insertBefore(thumb,add);reader.onload=()=>{thumb.innerHTML=`<img src="${reader.result}" alt="详情图 ${index+1} 预览">`;};reader.readAsDataURL(file);});toast(`已选择 ${Math.min(event.target.files.length,8)} 张商品详情图`);}
      });
      document.addEventListener('input', event => {
        if(event.target.id==='stationSearch'){state.stationQuery=event.target.value; const temp=document.createElement('div');temp.innerHTML=stationsPage();$('#stationTable').outerHTML=temp.querySelector('#stationTable').outerHTML;}
        if(event.target.id==='orderSearch'){state.orderQuery=event.target.value; const kind=state.page==='orders-delivery'?'delivery':state.page==='orders-pickup'?'pickup':'all',temp=document.createElement('div');temp.innerHTML=ordersPage(kind);$('#orderTable').outerHTML=temp.querySelector('#orderTable').outerHTML;}
        if(event.target.id==='bloodSearch'){state.bloodQuery=event.target.value; const temp=document.createElement('div');temp.innerHTML=bloodPage(state.page==='anomalies'?'anomaly':'all');$('#bloodTable').outerHTML=temp.querySelector('#bloodTable').outerHTML;}
      });
      modalLayer.addEventListener('click',e=>{if(e.target===modalLayer)closeModal();});
      document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
      render(false);
    })();
  </script>
</body>
</html>
