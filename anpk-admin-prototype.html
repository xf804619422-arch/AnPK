<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安派科 · 运营管理后台原型</title>
  <style>
    :root {
      --brand: #0a746c;
      --brand-2: #159588;
      --brand-dark: #073f3c;
      --brand-deep: #102f2e;
      --brand-soft: #e7f6f2;
      --accent: #d5ee72;
      --canvas: #f3f6f5;
      --surface: #ffffff;
      --surface-2: #f8fbfa;
      --ink: #183331;
      --muted: #718481;
      --line: #e0e9e7;
      --line-strong: #cbd9d6;
      --orange: #e8873e;
      --orange-soft: #fff2e8;
      --red: #d95757;
      --red-soft: #fff0f0;
      --blue: #407dc6;
      --blue-soft: #edf4ff;
      --purple: #795bb7;
      --purple-soft: #f3effc;
      --shadow-sm: 0 7px 24px rgba(19, 62, 58, .06);
      --shadow: 0 22px 55px rgba(15, 56, 53, .14);
      --radius: 16px;
      --font: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-width: 1180px; min-height: 100%; }
    body { font-family: var(--font); color: var(--ink); background: var(--canvas); font-size: 14px; }
    button, input, select, textarea { font: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid rgba(10,116,108,.16); outline-offset: 2px; }
    .app { min-height: 100vh; }
    .sidebar { position: fixed; inset: 0 auto 0 0; width: 260px; z-index: 50; display: flex; flex-direction: column; color: #fff; background: linear-gradient(180deg, #102f2e 0%, #0a2827 100%); box-shadow: 10px 0 32px rgba(8,35,33,.09); }
    .brand { min-height: 82px; display: flex; align-items: center; gap: 12px; padding: 18px 20px; border-bottom: 1px solid rgba(255,255,255,.08); }
    .brand-mark { width: 42px; height: 42px; flex: 0 0 42px; display: grid; place-items: center; border-radius: 14px; color: #113d39; background: linear-gradient(145deg, #d9f281, #73d3bd); font-weight: 950; font-size: 18px; box-shadow: 0 10px 22px rgba(0,0,0,.22), inset 0 1px rgba(255,255,255,.55); }
    .brand strong { display: block; font-size: 15px; letter-spacing: .04em; }
    .brand small { display: block; margin-top: 4px; color: rgba(255,255,255,.48); font-size: 9px; letter-spacing: .14em; }
    .nav { flex: 1; overflow-y: auto; padding: 14px 12px 24px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent; }
    .nav-group { margin-bottom: 16px; }
    .nav-label { padding: 0 12px 7px; color: rgba(255,255,255,.35); font-size: 10px; font-weight: 800; letter-spacing: .15em; }
    .nav-item { width: 100%; min-height: 39px; display: flex; align-items: center; gap: 10px; margin: 2px 0; padding: 8px 10px; border: 0; border-radius: 11px; color: rgba(255,255,255,.7); background: transparent; cursor: pointer; text-align: left; transition: .17s ease; }
    .nav-item:hover { color: #fff; background: rgba(255,255,255,.07); transform: translateX(1px); }
    .nav-item.active { color: #fff; background: linear-gradient(90deg, rgba(106,206,186,.25), rgba(106,206,186,.08)); box-shadow: inset 3px 0 #d5ee72; }
    .nav-icon { width: 26px; height: 26px; flex: 0 0 26px; display: grid; place-items: center; border-radius: 8px; background: rgba(255,255,255,.07); font-size: 10px; font-weight: 900; }
    .nav-item.active .nav-icon { color: #0a4944; background: #bfe8a2; }
    .nav-text { flex: 1; font-size: 12px; }
    .nav-count { min-width: 19px; height: 19px; display: grid; place-items: center; padding: 0 5px; border-radius: 10px; color: #fff; background: var(--orange); font-size: 9px; font-weight: 900; }
    .sidebar-foot { padding: 13px 14px 16px; border-top: 1px solid rgba(255,255,255,.08); }
    .account { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 13px; background: rgba(255,255,255,.055); }
    .avatar { width: 34px; height: 34px; flex: 0 0 34px; display: grid; place-items: center; border-radius: 11px; color: #0b4a45; background: #bfe3d9; font-size: 11px; font-weight: 900; }
    .account-copy { flex: 1; min-width: 0; }
    .account strong { display: block; font-size: 11px; }
    .account small { color: rgba(255,255,255,.43); font-size: 9px; }
    .logout { border: 0; color: rgba(255,255,255,.5); background: transparent; cursor: pointer; font-size: 16px; }
    .main { min-height: 100vh; margin-left: 260px; width: calc(100% - 260px); }
    .content { width: min(1500px, 100%); margin: 0 auto; padding: 32px 38px 60px; }
    .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 28px; margin-bottom: 23px; }
    .page-kicker { margin-bottom: 7px; color: var(--brand); font-size: 10px; font-weight: 900; letter-spacing: .16em; }
    .page-head h1 { margin: 0; font-size: 28px; line-height: 1.18; letter-spacing: -.035em; }
    .page-head p { max-width: 760px; margin: 9px 0 0; color: var(--muted); line-height: 1.7; font-size: 12px; }
    .page-actions { display: flex; align-items: center; gap: 9px; padding-top: 5px; }
    .scope { display: flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: #fff; color: var(--muted); font-size: 11px; }
    .scope select, .scope input { border: 0; outline: 0; color: var(--ink); background: transparent; font-weight: 700; font-size: 11px; }
    .btn { min-height: 38px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 14px; border: 1px solid transparent; border-radius: 10px; color: inherit; background: #fff; cursor: pointer; font-size: 12px; font-weight: 800; white-space: nowrap; transition: .16s ease; }
    .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
    .btn.primary { color: #fff; border-color: var(--brand); background: var(--brand); }
    .btn.primary:hover { background: var(--brand-dark); }
    .btn.secondary { color: var(--brand); border-color: #c7e6df; background: var(--brand-soft); }
    .btn.ghost { color: var(--ink); border-color: var(--line-strong); background: #fff; }
    .btn.danger { color: var(--red); border-color: #efcaca; background: var(--red-soft); }
    .btn.small { min-height: 30px; padding: 5px 9px; border-radius: 8px; font-size: 10px; }
    .btn.link { min-height: auto; padding: 2px; border: 0; color: var(--brand); background: transparent; }
    .btn.link.blue-link { color: var(--blue); font-weight: 900; text-decoration: underline; text-decoration-color: rgba(64,125,198,.35); text-underline-offset: 3px; }
    .card { border: 1px solid rgba(215,227,224,.92); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-sm); }
    .grid { display: grid; gap: 17px; }
    .cols-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
    .cols-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .cols-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .metric { position: relative; min-height: 124px; overflow: hidden; padding: 19px; }
    .metric::after { content: ""; position: absolute; top: -34px; right: -25px; width: 95px; height: 95px; border-radius: 50%; background: var(--brand-soft); }
    .metric.orange::after { background: var(--orange-soft); }
    .metric.blue::after { background: var(--blue-soft); }
    .metric.purple::after { background: var(--purple-soft); }
    .metric-top { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 11px; }
    .metric-icon { width: 31px; height: 31px; display: grid; place-items: center; border-radius: 10px; color: var(--brand); background: var(--brand-soft); font-size: 10px; font-weight: 900; }
    .metric.orange .metric-icon { color: var(--orange); background: var(--orange-soft); }
    .metric.blue .metric-icon { color: var(--blue); background: var(--blue-soft); }
    .metric.purple .metric-icon { color: var(--purple); background: var(--purple-soft); }
    .metric strong { display: block; margin-top: 17px; font-size: 28px; line-height: 1; letter-spacing: -.035em; }
    .metric small { display: block; margin-top: 7px; color: var(--muted); font-size: 10px; }
    .section { margin-top: 19px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 11px; }
    .section-head h2 { margin: 0; font-size: 16px; }
    .section-head p { margin: 4px 0 0; color: var(--muted); font-size: 10px; }
    .split { display: grid; grid-template-columns: minmax(0,1.55fr) minmax(300px,.78fr); gap: 17px; }
    .panel { padding: 20px; }
    .panel-title { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 17px; }
    .panel-title h3 { margin: 0; font-size: 14px; }
    .panel-title span { color: var(--muted); font-size: 10px; }
    .hero { position: relative; overflow: hidden; padding: 25px; color: #fff; border: 0; background: linear-gradient(120deg, #0a6f68, #154e4b); box-shadow: 0 19px 45px rgba(13,83,78,.17); }
    .hero::before, .hero::after { content: ""; position: absolute; border: 1px solid rgba(255,255,255,.12); border-radius: 50%; }
    .hero::before { width: 280px; height: 280px; top: -165px; right: -45px; }
    .hero::after { width: 140px; height: 140px; right: 110px; bottom: -105px; }
    .hero-inner { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 28px; }
    .hero-tag { display: inline-flex; padding: 5px 9px; border-radius: 12px; color: #efffd0; background: rgba(213,238,114,.14); font-size: 9px; font-weight: 900; }
    .hero h2 { margin: 12px 0 7px; font-size: 23px; }
    .hero p { margin: 0; color: rgba(255,255,255,.64); font-size: 11px; }
    .hero-stats { display: flex; gap: 30px; }
    .hero-stats strong { display: block; font-size: 23px; }
    .hero-stats small { color: rgba(255,255,255,.52); font-size: 9px; }
    .chart { height: 205px; display: flex; align-items: flex-end; gap: 10px; padding-top: 24px; border-bottom: 1px solid var(--line); }
    .bar-col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 7px; color: var(--muted); font-size: 9px; }
    .bar { width: min(28px,70%); min-height: 12px; border-radius: 7px 7px 2px 2px; background: linear-gradient(180deg, #61c8b4, #0b7b72); transition: .2s ease; }
    .bar-col:hover .bar { filter: brightness(.92); transform: translateY(-2px); }
    .task-list { display: grid; gap: 9px; }
    .task { display: flex; align-items: center; gap: 11px; min-height: 55px; padding: 10px 11px; border: 1px solid var(--line); border-radius: 12px; background: #fbfdfc; }
    .task-dot { width: 9px; height: 9px; flex: 0 0 9px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 0 5px rgba(232,135,62,.1); }
    .task-dot.red { background: var(--red); box-shadow: 0 0 0 5px rgba(217,87,87,.09); }
    .task-dot.blue { background: var(--blue); box-shadow: 0 0 0 5px rgba(64,125,198,.09); }
    .task-copy { flex: 1; }
    .task strong { display: block; font-size: 11px; }
    .task small { color: var(--muted); font-size: 9px; }
    .task b { font-size: 12px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 13px 15px; margin-bottom: 13px; }
    .filters { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
    .filter { padding: 7px 10px; border: 0; border-radius: 8px; color: var(--muted); background: transparent; cursor: pointer; font-size: 10px; font-weight: 800; }
    .filter.active { color: var(--brand); background: var(--brand-soft); }
    .search { width: 285px; height: 37px; display: flex; align-items: center; gap: 8px; padding: 0 11px; border: 1px solid var(--line-strong); border-radius: 10px; background: #fff; }
    .search span { color: #8ea19e; }
    .search input { min-width: 0; flex: 1; border: 0; outline: 0; color: var(--ink); background: transparent; font-size: 11px; }
    .table-card { overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th { padding: 12px 14px; border-bottom: 1px solid var(--line); color: var(--muted); background: #f7faf9; text-align: left; font-size: 9px; font-weight: 900; letter-spacing: .03em; }
    td { padding: 14px; border-bottom: 1px solid #edf2f1; vertical-align: middle; font-size: 11px; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #fbfdfc; }
    .cell-main { color: var(--ink); font-weight: 850; }
    .cell-sub { margin-top: 4px; color: var(--muted); font-size: 9px; }
    .table-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
    .badge { min-height: 23px; display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 11px; color: var(--muted); background: #edf2f1; font-size: 9px; font-weight: 900; }
    .badge.green { color: #167b5e; background: #e7f6f0; }
    .badge.orange { color: #bd6828; background: var(--orange-soft); }
    .badge.red { color: var(--red); background: var(--red-soft); }
    .badge.blue { color: var(--blue); background: var(--blue-soft); }
    .badge.purple { color: var(--purple); background: var(--purple-soft); }
    .badge.outline { color: var(--brand); border: 1px solid #c0dfd9; background: #fff; }
    .service-tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .detail-layout { display: grid; grid-template-columns: minmax(0,1fr) 350px; gap: 17px; align-items: start; }
    .detail-card { padding: 20px; margin-bottom: 15px; }
    .detail-title { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 5px; padding-bottom: 13px; border-bottom: 1px solid var(--line); }
    .detail-title h3 { margin: 0; font-size: 14px; }
    .info-row { min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 20px; border-bottom: 1px solid #edf2f1; font-size: 11px; }
    .info-row:last-child { border-bottom: 0; }
    .info-row > span { color: var(--muted); }
    .info-row > strong { max-width: 65%; text-align: right; }
    .sticky { position: sticky; top: 22px; }
    .service-card { display: flex; align-items: center; gap: 13px; padding: 16px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface-2); }
    .service-card + .service-card { margin-top: 10px; }
    .service-icon { width: 41px; height: 41px; flex: 0 0 41px; display: grid; place-items: center; border-radius: 13px; color: var(--brand); background: var(--brand-soft); font-size: 10px; font-weight: 900; }
    .service-icon.blue { color: var(--blue); background: var(--blue-soft); }
    .service-copy { flex: 1; }
    .service-copy strong { display: block; font-size: 12px; }
    .service-copy small { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; }
    .timeline { padding: 4px 0; }
    .timeline-item { position: relative; min-height: 60px; display: grid; grid-template-columns: 27px 1fr; gap: 10px; }
    .timeline-item::after { content: ""; position: absolute; left: 13px; top: 26px; bottom: -2px; width: 2px; background: var(--line); }
    .timeline-item:last-child::after { display: none; }
    .timeline-dot { z-index: 1; width: 27px; height: 27px; display: grid; place-items: center; border: 4px solid #fff; border-radius: 50%; color: #879995; background: #edf2f1; box-shadow: 0 0 0 1px var(--line); font-size: 8px; font-weight: 900; }
    .timeline-item.done .timeline-dot { color: #fff; background: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
    .timeline-item.current .timeline-dot { color: #fff; background: var(--orange); box-shadow: 0 0 0 4px rgba(232,135,62,.12); }
    .timeline-copy { padding: 3px 0 13px; }
    .timeline-copy strong { display: block; font-size: 11px; }
    .timeline-copy small { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; }
    .notice { padding: 13px 15px; border: 1px solid #f0dbb2; border-radius: 12px; color: #77531b; background: #fff7e8; line-height: 1.65; font-size: 10px; }
    .notice strong { display: block; margin-bottom: 2px; color: #694814; font-size: 11px; }
    .notice.green { border-color: #c9e5dd; color: #3f7067; background: #edf8f5; }
    .notice.green strong { color: var(--brand); }
    .notice.red { border-color: #efcccc; color: #925353; background: var(--red-soft); }
    .notice.red strong { color: var(--red); }
    .notice.blue { border-color: #ccdcf1; color: #4c6e98; background: var(--blue-soft); }
    .notice.blue strong { color: var(--blue); }
    .field { display: block; margin-bottom: 14px; }
    .field > span { display: block; margin-bottom: 6px; color: var(--muted); font-size: 10px; font-weight: 800; }
    .field input, .field select, .field textarea { width: 100%; padding: 10px 11px; border: 1px solid var(--line-strong); border-radius: 10px; outline: 0; color: var(--ink); background: #fff; font-size: 11px; transition: .15s ease; }
    .field input, .field select { height: 39px; }
    .field textarea { min-height: 76px; resize: vertical; line-height: 1.55; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: #6abcae; box-shadow: 0 0 0 3px rgba(10,116,108,.08); }
    .field-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 0 13px; }
    .check-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; margin-bottom: 15px; }
    .check-card { display: flex; align-items: flex-start; gap: 9px; padding: 12px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface-2); }
    .check-card input { margin-top: 2px; accent-color: var(--brand); }
    .check-card strong { display: block; font-size: 11px; }
    .check-card small { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; line-height: 1.45; }
    .permission-tree { overflow: hidden; border: 1px solid var(--line-strong); border-radius: 13px; background: #fff; }
    .permission-group + .permission-group { border-top: 1px solid var(--line); }
    .permission-group-head { display: flex; align-items: center; gap: 9px; padding: 12px 14px; color: var(--ink); background: #f3f8f7; font-size: 11px; font-weight: 900; cursor: pointer; }
    .permission-group-head input, .permission-menu-title input, .permission-check input { accent-color: var(--brand); }
    .permission-children { padding: 0 14px; }
    .permission-menu { display: grid; grid-template-columns: 150px minmax(0,1fr); gap: 16px; align-items: start; padding: 12px 0; }
    .permission-menu + .permission-menu { border-top: 1px dashed var(--line); }
    .permission-menu-title { display: flex; align-items: center; gap: 8px; min-height: 27px; color: var(--ink); font-size: 10px; font-weight: 800; cursor: pointer; }
    .permission-actions { display: flex; flex-wrap: wrap; gap: 7px; }
    .permission-check { display: inline-flex; align-items: center; gap: 6px; min-height: 27px; padding: 5px 9px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); background: var(--surface-2); font-size: 9px; cursor: pointer; }
    .permission-check:has(input:checked) { border-color: #a9c9ee; color: var(--blue); background: var(--blue-soft); }
    .product-cell { display: flex; align-items: center; gap: 11px; min-width: 230px; }
    .product-thumb { width: 48px; height: 48px; flex: 0 0 48px; display: grid; place-items: center; overflow: hidden; border: 1px solid #cfe2de; border-radius: 12px; color: var(--brand); background: linear-gradient(145deg,#edf8f5,#dcefea); font-size: 10px; font-weight: 900; }
    .product-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .price-stack strong { display: block; font-size: 12px; }
    .price-stack small { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; }
    .order-item-list { min-width: 245px; display: grid; gap: 7px; }
    .order-item-line { display: grid; grid-template-columns: minmax(0,1fr) auto auto; align-items: center; gap: 7px; }
    .order-item-name { overflow: hidden; color: var(--ink); font-size: 10px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
    .order-item-line small { color: var(--muted); font-size: 9px; font-weight: 800; white-space: nowrap; }
    .order-detail-products { overflow: hidden; margin-bottom: 14px; border: 1px solid var(--line); border-radius: 12px; }
    .order-detail-product { display: grid; grid-template-columns: minmax(0,1fr) auto auto; align-items: center; gap: 12px; padding: 13px 14px; background: var(--surface-2); }
    .order-detail-product + .order-detail-product { border-top: 1px solid var(--line); }
    .order-detail-product-copy strong { display: block; font-size: 11px; }
    .order-detail-product-copy small { display: block; margin-top: 4px; color: var(--muted); font-size: 9px; }
    .order-detail-product-price { min-width: 82px; text-align: right; }
    .order-detail-product-price strong { display: block; font-size: 11px; }
    .order-detail-product-price small { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; }
    .upload-grid { display: grid; grid-template-columns: minmax(0,.75fr) minmax(0,1.25fr); gap: 14px; margin-bottom: 15px; }
    .upload-group > span { display: block; margin-bottom: 7px; color: var(--muted); font-size: 10px; font-weight: 800; }
    .upload-box { min-height: 142px; display: grid; place-items: center; overflow: hidden; padding: 12px; border: 1px dashed #a9ccc5; border-radius: 12px; color: var(--muted); background: #f7fbfa; cursor: pointer; text-align: center; transition: .16s ease; }
    .upload-box:hover { border-color: var(--brand); background: var(--brand-soft); }
    .upload-box strong { display: block; margin-top: 7px; color: var(--ink); font-size: 11px; }
    .upload-box small { display: block; margin-top: 4px; font-size: 9px; line-height: 1.45; }
    .upload-mark { width: 48px; height: 48px; display: grid; place-items: center; margin: 0 auto; border-radius: 14px; color: var(--brand); background: #e2f2ee; font-size: 18px; font-weight: 900; }
    .upload-box img { width: 100%; height: 118px; border-radius: 9px; object-fit: cover; }
    .upload-input { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }

      function settlementRangeFactor(){
        const start=new Date(`${state.settlementStart}T00:00:00`),end=new Date(`${state.settlementEnd}T00:00:00`);
        if(Number.isNaN(start.getTime())||Number.isNaN(end.getTime())||end<start)return 1;
        return Math.max(1/30,(Math.round((end-start)/86400000)+1)/30);
      }

      }

      function adminsPage(){
        const rows=state.admins.map(x=>`<tr><td><div class="cell-main">${esc(x.name)}</div><div class="cell-sub">${x.id}</div></td><td>${badge(x.role)}</td><td>${esc(x.account)}</td><td>${esc(x.scope)}</td><td>${badge(x.status)}</td><td>${x.last}</td><td><div class="table-actions"><button class="btn small ghost" data-action="reset-admin" data-id="${x.id}">重置密码</button><button class="btn small link" data-action="toggle-admin" data-id="${x.id}">${x.status==='启用'?'停用':'启用'}</button></div></td></tr>`).join('');
        return `${pageHead('ADMIN ACCOUNTS','后台账号','创建后台登录账号，并为账号分配已配置的角色与数据范围。',`<button class="btn primary" data-action="open-create-admin">＋ 创建后台账号</button>`)}

      }

      function rolesPage(){
        const allKeys=allPermissionKeys();
        const rows=state.roles.map(x=>{const accountCount=state.admins.filter(admin=>admin.role===x.name).length,selected=x.permissions.includes('*')?allKeys:x.permissions,menuCount=new Set(selected.map(key=>key.split('.')[0])).size;return `<tr><td><div class="cell-main">${esc(x.name)}</div><div class="cell-sub">${esc(x.code)} · ${x.id}</div></td><td><strong>${accountCount}</strong> 个</td><td>${esc(x.scope)}</td><td><div class="service-tags"><span class="badge blue">${menuCount} 个子菜单</span><span class="badge outline">${selected.length} 个按钮权限</span></div></td><td>${badge(x.status)}</td><td>${x.updated}</td><td><div class="table-actions"><button class="btn small ghost" data-action="edit-role" data-id="${x.id}">编辑权限</button>${x.code!=='SUPER_ADMIN'?`<button class="btn small link" data-action="toggle-role" data-id="${x.id}">${x.status==='启用'?'停用':'启用'}</button>`:''}</div></td></tr>`;}).join('');
        return `${pageHead('ROLE PERMISSIONS','角色管理','按角色配置数据范围，并通过权限树控制每个子菜单及其页面按钮。',`<button class="btn primary" data-action="open-create-role">＋ 创建角色</button>`)}
        <div class="card table-card"><table><thead><tr><th>角色</th><th>关联账号</th><th>数据范围</th><th>授权范围</th><th>状态</th><th>更新时间</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table>${pagination(state.roles.length)}</div>`;
      }

      function logsPage(){
        const filter=state.listFilters.logs;let list=state.logs;if(filter==='stations')list=list.filter(x=>['区域组织','社区合作站','合作站账号'].some(name=>x.module.includes(name)));if(filter==='orders')list=list.filter(x=>['订单','退款'].some(name=>x.module.includes(name)));if(filter==='blood')list=list.filter(x=>['采血','报告','样本'].some(name=>x.module.includes(name)));
        const rows=list.map(x=>`<tr><td>${x.time}</td><td class="cell-main">${esc(x.operator)}</td><td>${badge(x.module)}</td><td>${esc(x.action)}</td><td>${esc(x.detail)}</td></tr>`).join('');
        return `${pageHead('AUDIT LOG','操作日志','记录关键业务操作、账号和时间，确保站点、订单、卡密、检测数据与报告变更可追溯。',`<button class="btn ghost" data-action="export">导出日志</button>`)}
        <div class="card toolbar"><div class="filters">${listTab('logs','all','全部模块')}${listTab('logs','stations','组织站点')}${listTab('logs','orders','订单售后')}${listTab('logs','blood','采血报告')}</div><div class="search"><span>⌕</span><input placeholder="操作人、动作或业务编号"></div></div>
        <div class="card table-card"><table><thead><tr><th>操作时间</th><th>操作账号</th><th>业务模块</th><th>操作动作</th><th>操作内容</th></tr></thead><tbody>${rows}</tbody></table>${pagination(list.length)}</div>`;
      }

      const renderers={
        dashboard:dashboardPage, provinces:()=>operatorsPage('province'), cities:()=>operatorsPage('city'), applications:applicationsPage, stations:stationsPage, 'station-detail':stationDetailPage,
        products:productsPage, coupons:couponsPage, 'orders-all':()=>ordersPage('all'), 'orders-delivery':()=>ordersPage('delivery'), 'orders-pickup':()=>ordersPage('pickup'), 'order-detail':orderDetailPage, refunds:refundsPage,
        'card-batches':batchesPage, cards:cardsPage, 'health-settlement':healthSettlementPage, 'blood-settlement':bloodSettlementPage, blood:()=>bloodPage('all'), anomalies:()=>bloodPage('anomaly'), 'blood-detail':bloodDetailPage, reports:reportsPage,

      function activeNav(){ if(state.page==='station-detail')return 'stations'; if(state.page==='order-detail'){const x=state.orders.find(o=>o.id===state.selectedOrder);return x?.type==='快递配送'?'orders-delivery':'orders-pickup';} if(state.page==='blood-detail'){const x=state.bloodForms.find(b=>b.id===state.selectedBlood);return x?.status==='样本异常'?'anomalies':'blood';} return state.page; }
      function updateNav(){ document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.page===activeNav())); $('#applicationCount').textContent=state.applications.filter(x=>x.status==='待联系').length; $('#shippingCount').textContent=state.orders.filter(x=>x.status==='待发货').length; $('#refundCount').textContent=state.orders.filter(x=>x.status==='退款申请').length; $('#anomalyCount').textContent=state.bloodForms.filter(x=>x.status==='样本异常').length; }
      function render(scroll=true){ pageRoot.innerHTML=(renderers[state.page]||dashboardPage)(); updateNav(); if(scroll)window.scrollTo({top:0,behavior:'smooth'}); }
      function go(page){ state.page=page; render(); }
      function toast(message){ const el=$('#toast'); el.textContent=message; el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2300); }
      function showModal(title,body,foot='',wide=false){ $('#modalTitle').textContent=title; $('#modalBody').innerHTML=body; $('#modalFoot').innerHTML=foot||`<button class="btn ghost" data-action="close-modal">关闭</button>`; $('#modal').classList.toggle('wide',wide); modalLayer.classList.add('open'); modalLayer.setAttribute('aria-hidden','false'); }
      function closeModal(){ modalLayer.classList.remove('open'); modalLayer.setAttribute('aria-hidden','true'); }

      function regionProvinceModal(id=''){
        const item=state.regionProvinces.find(province=>province.id===id),linked=Boolean(item&&(state.provinces.some(operator=>operator.province===item.name)||state.regionCities.some(city=>city.provinceId===item.id)));
        showModal(item?'编辑省份':'新增省份',`${linked?'<div class="notice blue" style="margin-bottom:14px"><strong>区域已被业务引用</strong>省份名称已锁定，可调整排序；如需停用，请先处理启用中的运营主体和下级城市。</div>':''}<label class="field"><span>省份名称 *</span><input id="regionProvinceName" value="${esc(item?.name||'安徽省')}" ${linked?'readonly':''}></label><label class="field"><span>排序值 *</span><input id="regionProvinceSort" type="number" min="0" step="1" value="${item?.sort??50}"></label><div class="notice green"><strong>区域启用后可被引用</strong>新增省份保存后，可继续在该省下维护地级市，并用于省级运营及后台账号的数据范围配置。</div>`,`<button class="btn ghost" data-action="close-modal">取消</button><button class="btn primary" data-action="save-region-province" data-id="${id}">保存省份</button>`);
      }

      function syncPermissionTree(){
        document.querySelectorAll('[data-permission-menu]').forEach(parent=>{const children=[...document.querySelectorAll(`[data-role-permission][data-menu="${parent.dataset.permissionMenu}"]`)],checked=children.filter(input=>input.checked).length;parent.checked=children.length>0&&checked===children.length;parent.indeterminate=checked>0&&checked<children.length;});
        document.querySelectorAll('[data-permission-group]').forEach(parent=>{const children=[...document.querySelectorAll(`[data-role-permission][data-group="${parent.dataset.permissionGroup}"]`)],checked=children.filter(input=>input.checked).length;parent.checked=children.length>0&&checked===children.length;parent.indeterminate=checked>0&&checked<children.length;});
      }

          report.version+=1;report.fileName=file.name;report.uploader='报告运营账号';report.time=now();
          if(!existing)state.reports.unshift(report);
          if(blood){blood.status='报告完成';blood.note='报告已上传';}
          state.logs.unshift({time:now(),operator:'报告运营账号',module:'检测报告',action:replacing?'替换报告':'上传报告',detail:`${report.id} · v${report.version} · ${file.name}`});
          closeModal();state.reportTab='completed';state.reportQuery='';render(false);return toast(replacing?`报告已替换为 v${report.version}`:'报告上传成功，采血单已更新为报告完成');
        }
        if(a==='view-report'){ return showModal('检测报告预览',`<div style="min-height:340px;display:grid;place-items:center;border:1px solid var(--line);border-radius:13px;background:#f8fbfa"><div style="text-align:center"><div style="width:64px;height:76px;margin:0 auto 13px;display:grid;place-items:center;border-radius:10px;color:var(--red);background:#fff0f0;font-weight:900">PDF</div><strong style="display:block">安派科健康检测报告</strong><small style="display:block;margin-top:6px;color:var(--muted)">原型中仅模拟 PDF 文件预览</small></div></div>`,`<button class="btn ghost" data-action="close-modal">关闭</button><button class="btn primary" data-action="download-demo">下载 PDF</button>`,true); }

        if(a==='report-versions'){ const x=state.reports.find(r=>r.id===el.dataset.id); return showModal('报告版本记录',`<div class="timeline"><div class="timeline-item done"><span class="timeline-dot">✓</span><span class="timeline-copy"><strong>v${x.version} 当前有效版本</strong><small>${x.time} · ${esc(x.uploader||'报告运营账号')}上传 · ${esc(x.fileName)}</small></span></div>${x.version>1?'<div class="timeline-item done"><span class="timeline-dot">✓</span><span class="timeline-copy"><strong>v1 历史版本</strong><small>2026-08-25 16:08 · 已被替换，文件永久保留</small></span></div>':''}</div><div class="notice green"><strong>版本审计规则</strong>用户仅查看当前有效报告，后台保留全部历史 PDF、操作账号与替换时间。</div>`); }
        if(a==='view-user')return userDetailModal(el.dataset.id);
        if(a==='bind-user-station'){ const user=state.users.find(item=>item.id===el.dataset.id),stationId=$('#userBindingStation').value,station=state.stations.find(item=>item.id===stationId);if(!stationId)return toast('请选择要绑定的健康服务站点');if(!station?.health||station.status!=='启用')return toast('所选站点当前不可绑定');if(user.stationId===stationId)return toast('用户已绑定当前所选站点');const previous=stationName(user.stationId),oldSettlement=state.healthSettlements.find(item=>item.id===user.stationId),newSettlement=state.healthSettlements.find(item=>item.id===stationId);if(oldSettlement)oldSettlement.boundUsers=Math.max(0,oldSettlement.boundUsers-1);if(newSettlement)newSettlement.boundUsers+=1;user.stationId=stationId;addLog('C 端用户','绑定健康服务站',`${user.name} · ${previous} → ${station.name}`);closeModal();render(false);return toast('用户绑定站点已更新'); }

ivacyAgreement').value.trim(),$('#serviceAgreement').value.trim()];if(values.some(value=>!value))return toast('隐私保护指引和用户服务协议不能为空');[state.settings.privacyAgreement,state.settings.serviceAgreement]=values;}if(module==='copy'){const values=[$('#productWarmTip').value.trim(),$('#coldChainTip').value.trim(),$('#reportQueryTip').value.trim(),$('#offHoursTip').value.trim()];if(values.some(value=>!value))return toast('小程序文案配置不能为空');[state.settings.productWarmTip,state.settings.coldChainTip,state.settings.reportQueryTip,state.settings.offHoursTip]=values;}const labels={order:'订单参数',support:'客服信息',shipping:'用户寄送地址',returns:'退货地址',settlement:'站点结算配置',sms:'腾讯云短信配置',location:'腾讯位置服务配置',agreements:'小程序协议内容',copy:'小程序文案配置'};addLog('业务参数','保存模块',labels[module]);return toast(`${labels[module]}已保存`); }
        if(a==='open-create-role')return roleModal();

        if(a==='save-role'){ const current=state.roles.find(item=>item.id===el.dataset.id),name=$('#roleName').value.trim(),code=$('#roleCode').value.trim().toUpperCase(),scope=$('#roleScope').value,permissions=[...document.querySelectorAll('[data-role-permission]:checked')].map(input=>input.value);if(!name||!code)return toast('请填写角色名称和角色编码');if(!/^[A-Z][A-Z0-9_]*$/.test(code))return toast('角色编码需使用大写字母、数字或下划线');if(!permissions.length)return toast('请至少选择一项按钮权限');if(state.roles.some(item=>item.code===code&&item.id!==current?.id))return toast('角色编码已存在');if(current){const oldName=current.name;current.name=name;current.scope=scope;current.permissions=permissions;current.updated=now();state.admins.filter(admin=>admin.role===oldName).forEach(admin=>admin.role=name);}else state.roles.push({id:'ROLE'+Date.now().toString().slice(-5),name,code,scope,permissions,status:'启用',updated:now()});addLog('角色管理',current?'编辑角色':'创建角色',name);closeModal();state.page='roles';render(false);return toast(`角色“${name}”已保存`); }

        if(a==='confirm-create-admin'){ const name=$('#adminName').value.trim(),account=$('#adminAccount').value.trim(),role=$('#adminRole').value,scope=$('#adminScope').value;if(!name||!account||!scope)return toast('请填写完整账号信息和数据范围');state.admins.push({id:'AD'+Date.now().toString().slice(-4),name,role,scope,account,status:'启用',last:'尚未登录'});addLog('后台账号','创建账号',`${name} · ${scope}`);closeModal();render(false);return toast('后台账号已创建'); }

      document.addEventListener('change', event => {

        if(event.target.id==='adminRole'){const scopeSelect=$('#adminScope'),hint=$('#adminScopeHint');if(scopeSelect)scopeSelect.innerHTML=adminScopeOptions(event.target.value);if(hint)hint.textContent=adminScopeHint(event.target.value);}

        if(event.target.id==='couponValidityType'){const fixed=$('#couponFixedDates'),days=$('#couponDaysField'),isFixed=event.target.value==='fixed';if(fixed)fixed.style.display=isFixed?'grid':'none';if(days)days.style.display=isFixed?'none':'block';}

        if(event.target.id==='productMainImage'&&event.target.files[0]){const file=event.target.files[0],reader=new FileReader();reader.onload=()=>{$('#mainImagePreview').innerHTML=`<img src="${reader.result}" alt="商品主图预览"><strong>${esc(file.name)}</strong><small>已选择新的商品主图</small>`;};reader.readAsDataURL(file);}

        if(event.target.id==='cardImportFile'&&event.target.files[0]){const file=event.target.files[0],host=$('#importFileState');host.innerHTML=`<span class="upload-mark">✓</span><strong>${esc(file.name)}</strong><small>文件已选择，点击“确认导入”后自动校验并生成批次号</small>`;}
        if(event.target.id==='reportPdfFile'&&event.target.files[0]){const file=event.target.files[0],host=$('#reportPdfState'),valid=/\.pdf$/i.test(file.name)&&file.size<=20*1024*1024;host.innerHTML=`<span class="upload-mark">${valid?'✓':'!'}</span><strong>${esc(file.name)}</strong><small>${valid?`PDF 已选择 · ${(file.size/1024/1024).toFixed(2)} MB`:'文件格式不正确或超过 20 MB，请重新选择'}</small>`;}
        if(event.target.id==='batchReportZipFile'&&event.target.files[0]){const file=event.target.files[0],host=$('#batchReportZipState'),valid=/\.zip$/i.test(file.name);host.innerHTML=`<span class="upload-mark">${valid?'✓':'!'}</span><strong>${esc(file.name)}</strong><small>${valid?'ZIP 压缩包已选择，系统将按 PDF 文件名逐一匹配':'文件格式不正确，请选择 ZIP 压缩包'}</small>`;}
      });
      document.addEventListener('input', event => {
        if(event.target.id==='couponUserSearch'){const query=event.target.value.trim().toLowerCase();document.querySelectorAll('[data-coupon-user-row]').forEach(row=>row.hidden=!row.dataset.search.includes(query));}
        if(event.target.id==='couponSearch'){state.couponQuery=event.target.value;const temp=document.createElement('div');temp.innerHTML=couponsPage();$('#couponTable').outerHTML=temp.querySelector('#couponTable').outerHTML;}
