<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安派科 · 社区合作站 Web 端交互原型</title>
  <style>
    :root {
      --brand: #0a7069;
      --brand-dark: #064e49;
      --brand-deep: #123b39;
      --brand-soft: #e7f5f2;
      --mint: #bce6dd;
      --canvas: #f2f6f5;
      --surface: #ffffff;
      --ink: #173735;
      --muted: #6e8381;
      --line: #e2ebe9;
      --line-strong: #cedbd8;
      --orange: #e9863d;
      --orange-soft: #fff2e8;
      --danger: #d95555;
      --danger-soft: #fff0f0;
      --warning: #c98618;
      --warning-soft: #fff7e7;
      --success: #1d8c68;
      --blue: #3978c7;
      --blue-soft: #edf4ff;
      --shadow-sm: 0 6px 20px rgba(20, 65, 61, .06);
      --shadow: 0 18px 50px rgba(20, 65, 61, .10);
      --radius: 16px;
      --font: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-width: 1180px; min-height: 100%; }
    body { font-family: var(--font); color: var(--ink); background: var(--canvas); font-size: 14px; }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid rgba(10, 112, 105, .16); outline-offset: 2px; }

    .app { min-height: 100vh; display: flex; }
    .sidebar { position: fixed; inset: 0 auto 0 0; width: 252px; background: #123b39; color: #fff; display: flex; flex-direction: column; z-index: 30; box-shadow: 8px 0 30px rgba(9, 42, 40, .08); }
    .brand { height: 82px; padding: 20px 22px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,.08); }
    .brand-mark { width: 38px; height: 38px; border-radius: 13px; background: linear-gradient(145deg, #66c8b7, #1a887e); display: grid; place-items: center; font-weight: 900; font-size: 17px; box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 8px 20px rgba(3,28,27,.28); }
    .brand strong { display: block; font-size: 16px; letter-spacing: .04em; }
    .brand small { display: block; margin-top: 3px; color: rgba(255,255,255,.52); font-size: 10px; letter-spacing: .12em; }
    .nav-scroll { flex: 1; overflow-y: auto; padding: 14px 12px 24px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.18) transparent; }
    .nav-section { margin: 5px 0 16px; }
    .nav-label { padding: 0 12px 7px; color: rgba(255,255,255,.38); font-size: 10px; font-weight: 700; letter-spacing: .14em; }
    .nav-item { width: 100%; border: 0; background: transparent; color: rgba(255,255,255,.72); min-height: 40px; padding: 9px 10px; border-radius: 11px; display: flex; align-items: center; gap: 10px; cursor: pointer; text-align: left; transition: .18s ease; margin-bottom: 3px; }
    .nav-item:hover { background: rgba(255,255,255,.07); color: #fff; transform: translateX(1px); }
    .nav-item.active { background: linear-gradient(90deg, rgba(84,195,177,.25), rgba(84,195,177,.12)); color: #fff; box-shadow: inset 3px 0 #67c8b8; }
    .nav-icon { flex: 0 0 25px; width: 25px; height: 25px; border-radius: 8px; display: grid; place-items: center; background: rgba(255,255,255,.08); font-size: 10px; font-weight: 800; }
    .nav-item.active .nav-icon { color: #0f4f4a; background: #a6dfd4; }
    .nav-text { flex: 1; font-size: 13px; }
    .nav-count { min-width: 19px; height: 19px; padding: 0 6px; display: grid; place-items: center; border-radius: 10px; background: var(--orange); color: #fff; font-size: 10px; font-weight: 800; }
    .sidebar-foot { padding: 14px 16px 17px; border-top: 1px solid rgba(255,255,255,.08); }
    .account-card { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 13px; background: rgba(255,255,255,.055); }
    .avatar { width: 34px; height: 34px; flex: 0 0 34px; border-radius: 12px; display: grid; place-items: center; color: #0a514b; background: #bce6dd; font-size: 12px; font-weight: 900; }
    .account-card strong { display: block; font-size: 12px; }
    .account-card small { color: rgba(255,255,255,.46); font-size: 10px; }

    .main { min-height: 100vh; margin-left: 252px; width: calc(100% - 252px); }
    .content { width: min(1440px, 100%); margin: 0 auto; padding: 34px 38px 54px; }
    .page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 28px; margin-bottom: 24px; }
    .page-kicker { color: var(--brand); font-size: 10px; font-weight: 900; letter-spacing: .16em; margin-bottom: 7px; }
    .page-head h1 { margin: 0; font-size: 28px; line-height: 1.2; letter-spacing: -.03em; }
    .page-head p { margin: 9px 0 0; color: var(--muted); max-width: 680px; line-height: 1.7; }
    .page-actions { display: flex; align-items: center; gap: 10px; padding-top: 5px; }

    .btn { border: 1px solid transparent; border-radius: 10px; min-height: 38px; padding: 9px 15px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer; font-weight: 700; font-size: 13px; transition: .16s ease; white-space: nowrap; }
    .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
    .btn:disabled { cursor: not-allowed; opacity: .45; transform: none; box-shadow: none; }
    .btn.primary { color: #fff; background: var(--brand); border-color: var(--brand); }
    .btn.primary:hover { background: var(--brand-dark); }
    .btn.secondary { color: var(--brand); background: var(--brand-soft); border-color: #cfe8e3; }
    .btn.ghost { color: var(--ink); background: #fff; border-color: var(--line-strong); }
    .btn.danger { color: var(--danger); background: var(--danger-soft); border-color: #f3cccc; }
    .btn.small { min-height: 30px; border-radius: 8px; padding: 6px 10px; font-size: 11px; }
    .btn.link { padding: 3px; min-height: auto; color: var(--brand); background: transparent; border: 0; }
    .btn.full { width: 100%; }
    .btn-icon { font-size: 15px; line-height: 1; }

    .card { background: var(--surface); border: 1px solid rgba(214,227,224,.9); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
    .grid { display: grid; gap: 18px; }
    .grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .metric { padding: 20px; min-height: 126px; position: relative; overflow: hidden; }
    .metric::after { content: ""; position: absolute; width: 85px; height: 85px; right: -30px; top: -28px; border-radius: 50%; background: var(--brand-soft); }
    .metric.orange::after { background: var(--orange-soft); }
    .metric.red::after { background: var(--danger-soft); }
    .metric.blue::after { background: var(--blue-soft); }
    .metric-top { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 12px; }
    .metric-icon { width: 30px; height: 30px; border-radius: 9px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-weight: 900; }
    .metric.orange .metric-icon { color: var(--orange); background: var(--orange-soft); }
    .metric.red .metric-icon { color: var(--danger); background: var(--danger-soft); }
    .metric.blue .metric-icon { color: var(--blue); background: var(--blue-soft); }
    .metric strong { display: block; margin-top: 17px; font-size: 27px; line-height: 1; letter-spacing: -.03em; }
    .metric small { display: block; margin-top: 7px; color: var(--muted); font-size: 11px; }

    .section { margin-top: 20px; }
    .section-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 12px; }
    .section-head h2 { margin: 0; font-size: 17px; }
    .section-head p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .quick-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; }
    .quick-action { min-height: 102px; border: 1px solid var(--line); background: #fff; border-radius: 14px; padding: 17px; cursor: pointer; text-align: left; transition: .16s ease; }
    .quick-action:hover { border-color: #a9d4cc; transform: translateY(-2px); box-shadow: var(--shadow-sm); }
    .quick-action .q-icon { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: var(--brand); background: var(--brand-soft); font-weight: 900; margin-bottom: 11px; }
    .quick-action strong { display: block; font-size: 13px; }
    .quick-action small { color: var(--muted); font-size: 10px; display: block; margin-top: 4px; }

    .split { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(300px, .75fr); gap: 18px; }
    .panel { padding: 20px; }
    .panel-title { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 17px; }
    .panel-title h3 { margin: 0; font-size: 15px; }
    .panel-title span { color: var(--muted); font-size: 11px; }
    .status-list { display: grid; gap: 10px; }
    .status-row { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: #fbfdfc; }
    .status-dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 9px; background: var(--success); box-shadow: 0 0 0 5px rgba(29,140,104,.09); }
    .status-dot.orange { background: var(--orange); box-shadow: 0 0 0 5px rgba(233,134,61,.09); }
    .status-dot.red { background: var(--danger); box-shadow: 0 0 0 5px rgba(217,85,85,.09); }
    .status-row div { flex: 1; }
    .status-row strong { display: block; font-size: 12px; }
    .status-row small { color: var(--muted); font-size: 10px; }
    .status-value { font-weight: 800; font-size: 12px; }

    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px 16px; margin-bottom: 14px; }
    .filters { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .filter { border: 0; border-radius: 9px; background: transparent; padding: 7px 11px; color: var(--muted); cursor: pointer; font-size: 12px; font-weight: 700; }
    .filter.active { color: var(--brand); background: var(--brand-soft); }
    .search { width: 290px; height: 38px; border: 1px solid var(--line-strong); border-radius: 10px; background: #fff; display: flex; align-items: center; gap: 8px; padding: 0 11px; }
    .search span { color: #8ca09e; }
    .search input { min-width: 0; flex: 1; border: 0; outline: 0; color: var(--ink); background: transparent; font-size: 12px; }
    .search input::placeholder { color: #9aabaa; }

    .table-card { overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th { padding: 12px 15px; text-align: left; color: var(--muted); background: #f7faf9; font-size: 10px; font-weight: 800; letter-spacing: .03em; border-bottom: 1px solid var(--line); }
    td { padding: 15px; border-bottom: 1px solid #edf2f1; font-size: 12px; vertical-align: middle; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #fbfdfd; }
    .cell-main { font-weight: 800; color: var(--ink); }
    .cell-sub { color: var(--muted); font-size: 10px; margin-top: 4px; }
    .table-actions { display: flex; gap: 7px; align-items: center; }
    .badge { display: inline-flex; align-items: center; min-height: 24px; padding: 4px 9px; border-radius: 12px; font-size: 10px; font-weight: 800; color: var(--muted); background: #edf2f1; }
    .badge.green { color: var(--success); background: #e8f6f1; }
    .badge.orange { color: #be6b2b; background: var(--orange-soft); }
    .badge.red { color: var(--danger); background: var(--danger-soft); }
    .badge.blue { color: var(--blue); background: var(--blue-soft); }
    .badge.gray { color: #6d7f7d; background: #edf2f1; }
    .badge.outline { color: var(--brand); background: #fff; border: 1px solid #bcded8; }
    .empty { padding: 64px 20px; text-align: center; color: var(--muted); }
    .empty-icon { width: 52px; height: 52px; margin: 0 auto 14px; border-radius: 18px; display: grid; place-items: center; color: var(--brand); background: var(--brand-soft); font-weight: 900; }
    .empty h3 { color: var(--ink); margin: 0 0 7px; font-size: 15px; }
    .empty p { margin: 0; font-size: 11px; }

    .hero { padding: 24px; position: relative; overflow: hidden; background: linear-gradient(120deg, #0b6e67, #185f5b); color: #fff; border: 0; box-shadow: 0 18px 45px rgba(12,88,81,.19); }
    .hero::before, .hero::after { content: ""; position: absolute; border-radius: 50%; border: 1px solid rgba(255,255,255,.12); }
    .hero::before { width: 250px; height: 250px; right: -65px; top: -122px; }
    .hero::after { width: 150px; height: 150px; right: 60px; bottom: -115px; }
    .hero-content { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: center; gap: 30px; }
    .hero-label { display: inline-flex; align-items: center; gap: 7px; padding: 5px 9px; border-radius: 12px; background: rgba(255,255,255,.12); font-size: 10px; font-weight: 800; }
    .hero h2 { margin: 13px 0 6px; font-size: 23px; }
    .hero p { margin: 0; color: rgba(255,255,255,.65); font-size: 12px; }
    .hero-meta { display: flex; gap: 28px; }
    .hero-meta div { min-width: 85px; }
    .hero-meta strong { display: block; font-size: 23px; }
    .hero-meta small { color: rgba(255,255,255,.58); font-size: 10px; }

    .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 20px; }
    .switch-copy { display: flex; align-items: center; gap: 13px; }
    .switch-copy .state-icon { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; color: var(--success); background: #e8f6f1; font-weight: 900; }
    .switch-copy .state-icon.off { color: var(--danger); background: var(--danger-soft); }
    .switch-copy strong { display: block; font-size: 14px; }
    .switch-copy small { display: block; color: var(--muted); margin-top: 4px; font-size: 11px; }
    .switch { width: 48px; height: 27px; border: 0; border-radius: 14px; padding: 3px; background: #c7d2d0; cursor: pointer; transition: .2s ease; }
    .switch::after { content: ""; display: block; width: 21px; height: 21px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.18); transition: .2s ease; }
    .switch.on { background: var(--success); }
    .switch.on::after { transform: translateX(21px); }

    .notice { padding: 14px 16px; border: 1px solid #f1dcb4; border-radius: 12px; background: var(--warning-soft); color: #76521b; line-height: 1.65; font-size: 11px; }
    .notice strong { display: block; color: #6d4b15; margin-bottom: 2px; font-size: 12px; }
    .notice.green { border-color: #cae7df; background: #edf8f5; color: #3e6f65; }
    .notice.green strong { color: var(--brand); }
    .notice.red { border-color: #f0cccc; background: var(--danger-soft); color: #925252; }
    .notice.red strong { color: var(--danger); }
    .notice.blue { border-color: #cedef4; background: var(--blue-soft); color: #4a6d99; }
    .notice.blue strong { color: var(--blue); }

    .detail-layout { display: grid; grid-template-columns: minmax(0,1fr) 340px; gap: 18px; align-items: start; }
    .detail-card { padding: 20px; margin-bottom: 16px; }
    .detail-title { display: flex; justify-content: space-between; align-items: center; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 5px; }
    .detail-title h3 { margin: 0; font-size: 15px; }
    .info-row { min-height: 45px; display: flex; justify-content: space-between; align-items: center; gap: 20px; border-bottom: 1px solid #edf2f1; font-size: 12px; }
    .info-row:last-child { border-bottom: 0; }
    .info-row span { color: var(--muted); }
    .info-row strong { text-align: right; }
    .sticky-card { position: sticky; top: 24px; }
    .code-box { padding: 24px; text-align: center; background: linear-gradient(145deg, #f5fbf9, #fff); }
    .code-box .code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; color: var(--brand); font-size: 31px; font-weight: 900; letter-spacing: .18em; margin: 15px 0; }
    .code-box p { color: var(--muted); font-size: 11px; line-height: 1.6; }

    .query-card { max-width: 760px; padding: 26px; }
    .query-card h3 { margin: 0 0 6px; font-size: 17px; }
    .query-card > p { margin: 0 0 20px; color: var(--muted); line-height: 1.6; font-size: 12px; }
    .query-line { display: flex; gap: 10px; }
    .query-line .field { flex: 1; margin: 0; }
    .demo-link { margin-top: 11px; color: var(--muted); font-size: 10px; }
    .demo-link button { border: 0; background: transparent; padding: 0; color: var(--brand); cursor: pointer; font-weight: 800; }
    .result-card { max-width: 760px; margin-top: 16px; padding: 20px; }
    .result-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 12px; }
    .result-head h3 { margin: 0; font-size: 15px; }

    .field { display: block; margin-bottom: 15px; }
    .field > span { display: block; color: var(--muted); font-size: 11px; font-weight: 700; margin-bottom: 7px; }
    .field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line-strong); border-radius: 10px; background: #fff; color: var(--ink); padding: 10px 12px; outline: 0; transition: .15s ease; }
    .field input, .field select { height: 40px; }
    .field textarea { min-height: 82px; resize: vertical; line-height: 1.6; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: #75bdb2; box-shadow: 0 0 0 3px rgba(10,112,105,.08); }
    .field-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 0 14px; }

    .timeline { position: relative; display: grid; gap: 0; padding: 4px 0; }
    .timeline-item { position: relative; display: grid; grid-template-columns: 28px 1fr; gap: 9px; min-height: 62px; }
    .timeline-item::after { content: ""; position: absolute; left: 13px; top: 27px; bottom: -3px; width: 2px; background: var(--line); }
    .timeline-item:last-child::after { display: none; }
    .timeline-dot { width: 27px; height: 27px; border-radius: 50%; display: grid; place-items: center; color: #829491; background: #edf2f1; border: 4px solid #fff; box-shadow: 0 0 0 1px var(--line); font-size: 9px; font-weight: 900; z-index: 1; }
    .timeline-item.done .timeline-dot { color: #fff; background: var(--success); box-shadow: 0 0 0 1px var(--success); }
    .timeline-item.current .timeline-dot { color: #fff; background: var(--orange); box-shadow: 0 0 0 4px rgba(233,134,61,.13); }
    .timeline-copy { padding: 3px 0 15px; }
    .timeline-copy strong { display: block; font-size: 12px; }
    .timeline-copy small { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }

    .profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .profile-card { padding: 21px; }
    .profile-card h3 { margin: 0 0 16px; font-size: 15px; }
    .service-card { padding: 20px; display: flex; align-items: center; gap: 15px; }
    .service-icon { width: 48px; height: 48px; flex: 0 0 48px; border-radius: 15px; display: grid; place-items: center; color: var(--brand); background: var(--brand-soft); font-weight: 900; }
    .service-icon.blue { color: var(--blue); background: var(--blue-soft); }
    .service-card div { flex: 1; }
    .service-card strong { display: block; font-size: 14px; }
    .service-card p { color: var(--muted); margin: 5px 0 0; font-size: 10px; }
    .income-card { padding: 22px; background: linear-gradient(120deg,#ffffff 0%,#f2faf8 100%); }
    .income-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
    .income-copy h3 { margin: 5px 0 6px; font-size: 17px; }
    .income-copy p { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.6; }
    .income-stats { display: grid; grid-template-columns: 1.35fr 1fr; gap: 12px; margin-top: 18px; }
    .income-stat { padding: 17px 18px; border: 1px solid var(--line); border-radius: 13px; background: rgba(255,255,255,.9); }
    .income-stat span { display: block; color: var(--muted); font-size: 10px; }
    .income-stat strong { display: block; margin: 7px 0 5px; color: var(--ink); font-size: 24px; }
    .income-stat small { color: var(--muted); font-size: 9px; }
    .income-stat.primary { border-color: #91cfc4; background: var(--brand-soft); }
    .income-stat.primary strong { color: var(--brand); font-size: 30px; }
    .binding-card { padding: 22px; display: flex; align-items: center; gap: 22px; }
    .binding-card > div { flex: 1; }
    .binding-card h3 { margin: 0 0 6px; font-size: 17px; }
    .binding-card p { margin: 0; color: var(--muted); line-height: 1.7; font-size: 11px; }
    .binding-code { display: inline-flex; align-items: center; gap: 10px; margin-top: 14px; padding: 9px 11px; border: 1px dashed #93c9c0; border-radius: 10px; background: #f2faf8; }
    .binding-code strong { color: var(--brand); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .08em; }
    .qr-mock { width: 106px; height: 106px; flex: 0 0 106px; border: 8px solid #fff; border-radius: 10px; background-color: #fff; background-image: conic-gradient(from 90deg at 2px 2px, var(--brand-dark) 25%, transparent 0), conic-gradient(from 270deg at 7px 7px, var(--brand) 25%, transparent 0); background-position: 0 0, 5px 5px; background-size: 10px 10px; box-shadow: 0 0 0 1px var(--line-strong), var(--shadow-sm); }
    .relation-chain { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 12px; align-items: stretch; }
    .relation-node { min-height: 112px; padding: 17px; border: 1px solid var(--line); border-radius: 13px; background: #fbfdfc; position: relative; }
    .relation-node::after { content: "→"; position: absolute; right: -17px; top: 43px; color: #91aaa6; font-weight: 900; z-index: 2; }
    .relation-node:last-child::after { display: none; }
    .relation-node small { display: block; color: var(--muted); font-size: 10px; margin-bottom: 8px; }
    .relation-node strong { display: block; font-size: 13px; }

          <label class="field"><span>联系电话 *</span><input id="editStationPhone" value="${esc(profile.phone)}" placeholder="请输入联系电话"></label>
          <div class="query-line"><label class="field"><span>地图搜索地址</span><input id="mapSearch" value="${esc(profile.address)}" placeholder="输入道路、门牌号或地标"></label><button class="btn secondary" data-action="search-map-location">搜索地图</button></div>
          <div class="map-picker"><div class="map-river"></div><span class="map-marker">站</span><div class="map-caption"><strong>当前选点</strong><span id="mapCaption">${esc(profile.address)}</span></div></div>
          <div class="map-options">${options}</div>
          <label class="field"><span>已选服务地址 *</span><input id="editStationAddress" value="${esc(profile.address)}" readonly></label>
          <div class="field-grid"><label class="field"><span>经度</span><input id="editStationLng" value="${esc(profile.lng)}" readonly></label><label class="field"><span>纬度</span><input id="editStationLat" value="${esc(profile.lat)}" readonly></label></div>
        `,`<button class="btn ghost" data-action="close-modal">取消</button><button class="btn primary" data-action="save-station-profile">保存资料</button>`);
      }

      function saveStationProfile() {
        const phone = $('#editStationPhone')?.value.trim() || '';
        const address = $('#editStationAddress')?.value.trim() || '';
        const lng = $('#editStationLng')?.value.trim() || '';
        const lat = $('#editStationLat')?.value.trim() || '';
        const compactPhone = phone.replace(/\s+/g,'');
        if (!/^(1\d{10}|0\d{2,3}-?\d{7,8})$/.test(compactPhone)) return toast('请输入正确的手机号码或座机号码');
        if (!address || !lng || !lat) return toast('请先在地图中选择服务地址');
        state.stationProfile = { address, lng, lat, phone };
        addLog('站点资料','更新服务信息',`${address} · ${phone}`);
        closeModal();
        render(false);
        toast('站点资料已保存');
      }

      function blockIncompleteProfile(serviceName, serviceType) {
        if (profileComplete(serviceType)) return false;
        const missing = missingProfileFields(serviceType);
        showModal('请先完善站点资料',`<div class="confirm-icon">资</div><div class="modal-copy">${serviceName}暂时无法开启。请先补全以下资料：<strong style="display:block;color:var(--ink);margin-top:8px">${missing.join('、')}</strong></div>`,`<button class="btn ghost" data-action="close-modal">暂不处理</button><button class="btn primary" data-action="edit-station-profile">完善资料</button>`);
        return true;
      }

      function openVerifyConfirm(id) {
        const o = state.orders.find(x=>x.id===id);
        if (!o || o.status!=='待核销') return toast('当前订单不可核销');
        showModal('确认整单核销',`<div class="confirm-icon">核</div><div class="modal-copy"><strong style="display:block;color:var(--ink);font-size:14px;margin-bottom:7px">订单 ${o.id}</strong>本次将一次性核销 ${o.qty} 份套餐并出库 ${o.qty} 个通用采集盒。核销成功后订单不可再申请取消、退款或其他售后。</div><div class="notice red" style="margin-top:14px"><strong>请确认用户已经领取全部商品</strong>该操作不能撤销。</div>`,`<button class="btn ghost" data-action="close-modal">返回核对</button><button class="btn primary" data-action="confirm-verify" data-id="${o.id}">确认核销并出库</button>`);
      }

      function completeVerify(id) {
        const o = state.orders.find(x=>x.id===id);
        if (!o || o.status!=='待核销') return;
        const before = availableStock();
        const boundUser = state.boundUsers.find(user => user.phone === o.phone);
        const isNewBoundUser = !boundUser;
        const earnedCommission = orderCommission(o);
        o.status = '已核销';
        o.verified = now();
        state.inventory.total -= o.qty;
        state.inventory.locked = Math.max(0,state.inventory.locked-o.qty);
        state.inventoryLogs.unshift({id:'KC'+Date.now().toString().slice(-8),type:'核销出库',qty:-o.qty,before,after:availableStock(),ref:o.id,time:now()});
        if (isNewBoundUser) {
          state.boundUsers.unshift({ id:'U'+Date.now().toString().slice(-8), name:o.user, phone:o.phone, source:'首次核销自动绑定', boundAt:now(), firstOrder:o.id, orders:1, amount:o.amount, commission:earnedCommission });
          state.boundUserTotal += 1;
          addLog('绑定用户','首次核销自动绑定',`${o.user} ${o.phone}`);
        } else {
          boundUser.orders += 1;
          boundUser.amount += o.amount;
          boundUser.commission = (boundUser.commission || 0) + earnedCommission;
          if (boundUser.firstOrder === '—') boundUser.firstOrder = o.id;
        }
        state.boundCommissionTotal += earnedCommission;
        state.boundCommissionMonth += earnedCommission;
        addLog('健康服务','核销自提订单',`订单 ${o.id}，出库 ${o.qty} 盒`);
        addLog('健康服务','计入订单提成',`订单 ${o.id}，提成 ${money(earnedCommission)}`);
        state.verifyOrderId = id;
        closeModal();
        render(false);
        toast(isNewBoundUser ? '核销成功，并已自动绑定该用户' : '核销成功，订单已完成出库');
      }

      function openHours(type) {
        const isHealth = type==='health';
        const current = isHealth?state.healthHours:state.bloodHours;
        showModal(isHealth?'编辑健康服务营业时间':'采血服务营业时间',`${!isHealth?'<div class="notice blue" style="margin-bottom:16px"><strong>采血服务配置说明</strong>当前原型中采血服务状态由平台配置，站点仅查看时间；如需变更请联系平台。</div>':''}<div class="field-grid"><label class="field"><span>开始时间</span><input id="startHour" type="time" value="${current.slice(0,5)}" ${!isHealth?'disabled':''}></label><label class="field"><span>结束时间</span><input id="endHour" type="time" value="${current.slice(-5)}" ${!isHealth?'disabled':''}></label></div><div class="notice green"><strong>营业时间用于到站指引</strong>${isHealth?'即使当前不在营业时间，只要营业开关开启且库存充足，用户仍可下自提订单。':'用户在采血服务营业时间内直接到站，无需预约时段。'}</div>`,isHealth?`<button class="btn ghost" data-action="close-modal">取消</button><button class="btn primary" data-action="save-hours" data-type="health">保存时间</button>`:`<button class="btn primary" data-action="close-modal">我知道了</button>`);
      }

      function toggleHealth() {
        if (state.healthOpen) {
          showModal('暂停健康服务营业',`<div class="confirm-icon">停</div><div class="modal-copy">暂停后，本站不再接收新的自提订单；已经产生的待付款、待核销订单仍允许继续处理完成。</div>`,`<button class="btn ghost" data-action="close-modal">取消</button><button class="btn danger" data-action="confirm-toggle-health">确认暂停营业</button>`);
        } else {
          if (blockIncompleteProfile('健康服务','health')) return;
          state.healthOpen = true;
          addLog('健康服务','开启营业状态','站点开始接收新的自提订单');
          render(false);
          toast('营业状态已开启');
        }
      }

      function toggleBlood() {
        if (state.bloodOpen) {
          showModal('暂停采血服务营业',`<div class="confirm-icon">停</div><div class="modal-copy">暂停后，本站不再接收新的采血服务；已经创建的采血单仍允许继续接收、采血和寄出。</div>`,`<button class="btn ghost" data-action="close-modal">取消</button><button class="btn danger" data-action="confirm-toggle-blood">确认暂停营业</button>`);
        } else {
          if (blockIncompleteProfile('采血服务','blood')) return;
          state.bloodOpen = true;
          addLog('采血服务','开启营业状态','站点开始接收新的采血服务');
          render(false);
          toast('采血服务营业状态已开启');
        }
      }

      function openWorkerModal(type) {
        showModal('添加' + (type==='health'?'健康服务':'采血服务') + '工作人员',`<div class="notice blue" style="margin-bottom:16px"><strong>通过注册手机号搜索</strong>申请人不会自动成为工作人员，必须使用其小程序注册手机号另行添加。</div><div class="query-line"><label class="field"><input id="workerPhone" maxlength="11" value="13922156789" placeholder="输入 11 位手机号码"></label><button class="btn primary" data-action="search-worker" data-type="${type}">搜索</button></div><div id="workerSearchResult"></div>`,`<button class="btn ghost" data-action="close-modal">关闭</button>`);
      }

      function searchWorker(type) {
        const phone = $('#workerPhone')?.value.trim();
        const host = $('#workerSearchResult');
        if (!/^1\d{10}$/.test(phone)) { host.innerHTML = `<div class="notice red"><strong>手机号格式不正确</strong>请输入已注册小程序的 11 位手机号码。</div>`; return; }
        host.innerHTML = `<div class="status-row" style="margin-top:14px"><div class="avatar" style="flex:0 0 38px">林</div><div><strong>林晓雯</strong><small>${phone.slice(0,3)}****${phone.slice(-4)} · 已注册小程序</small></div><button class="btn small primary" data-action="add-worker" data-type="${type}" data-phone="${phone}">添加</button></div>`;
      }

      function addWorker(type, phone) {
        let worker = state.workers.find(w=>w.name==='林晓雯');
        if (!worker) {
          worker = {id:'W'+String(state.workers.length+1).padStart(2,'0'),name:'林晓雯',phone:phone.slice(0,3)+'****'+phone.slice(-4),health:false,blood:false,joined:now().slice(0,10),records:0};
          state.workers.push(worker);
        }
        if (worker[type]) return toast('该用户已拥有此项工作人员权限');
        worker[type] = true;
        addLog('工作人员','添加'+(type==='health'?'健康服务':'采血服务')+'工作人员',`${worker.name} ${worker.phone}`);
        closeModal(); render(false); toast('工作人员添加成功');
      }

      function receiveBlood(id) {
        const b = state.bloodForms.find(x=>x.id===id);
        if (!b || b.status!=='待采血') return toast('当前采血单不可接收');
        showModal('确认接收采血单',`<div class="confirm-icon" style="color:var(--blue);background:var(--blue-soft)">接</div><div class="modal-copy"><strong style="display:block;color:var(--ink);font-size:14px;margin-bottom:7px">${b.id} · ${b.person}</strong>请核对采血单编号、受检人和检测套餐。接收后采血单信息冻结，用户不能再修改或更换采血方式。</div>`,`<button class="btn ghost" data-action="close-modal">返回核对</button><button class="btn primary" data-action="confirm-receive-blood" data-id="${b.id}">确认接收</button>`);
      }

      function completeReceive(id) {
        const b = state.bloodForms.find(x=>x.id===id);
        if (!b || b.status!=='待采血') return;
        b.status='已接收'; b.received=now();
        addLog('采血服务','接收采血单',`采血单 ${b.id}`);
        state.receiveBloodId=id;
        closeModal(); render(false); toast('采血单已接收');
      }

      function shipBlood(id) {
        const b = state.bloodForms.find(x=>x.id===id);
        if (!b || b.status!=='已接收') return toast('当前采血单不可登记寄出');
        showModal('登记样本寄出',`<div class="notice green" style="margin-bottom:16px"><strong>快递信息为选填</strong>不填写快递公司和单号也可以将采血单变更为已寄出。</div><div class="info-row"><span>采血单编号</span><strong>${b.id}</strong></div><div class="info-row" style="margin-bottom:15px"><span>受检人</span><strong>${b.person}</strong></div><label class="field"><span>快递公司（选填）</span><select id="shipCompany"><option value="">不填写</option><option>顺丰速运</option><option>京东物流</option><option>其他快递</option></select></label><label class="field"><span>快递单号（选填）</span><input id="shipNo" placeholder="请输入快递单号"></label>`,`<button class="btn ghost" data-action="close-modal">取消</button><button class="btn primary" data-action="confirm-ship-blood" data-id="${b.id}">确认已寄出</button>`);
      }

      function completeShip(id) {
        const b = state.bloodForms.find(x=>x.id===id);
        if (!b || b.status!=='已接收') return;
        const company = $('#shipCompany')?.value;
        const no = $('#shipNo')?.value.trim();
        b.status='已寄出'; b.shipped=now(); b.logistics=company ? company + (no?' '+no:'') : '未填写物流信息';
        state.bloodIncomeCounts.today += 1;
        state.bloodIncomeCounts.week += 1;
        state.bloodIncomeCounts.month += 1;
        addLog('采血服务','登记样本寄出',`采血单 ${b.id}`);
        closeModal(); render(false); toast('样本已登记为已寄出');
      }

      document.addEventListener('click', event => {
        const el = event.target.closest('[data-page],[data-action]');
        if (!el) return;
        if (el.dataset.page) return go(el.dataset.page);
        const action = el.dataset.action;
        if (action==='close-modal') return closeModal();
        if (action==='filter-order') { state.orderFilter=el.dataset.value; return render(false); }
        if (action==='filter-bound-user') { state.boundUserFilter=el.dataset.value; return render(false); }
        if (action==='distribution-tab') { state.distributionTab=el.dataset.value; return render(false); }
        if (action==='filter-blood') { state.bloodFilter=el.dataset.value; return render(false); }
        if (action==='blood-income-period') { state.bloodIncomePeriod=el.dataset.value; return render(false); }
        if (action==='view-order') { state.selectedOrderId=el.dataset.id; return go('order-detail'); }
        if (action==='verify-order') { state.verifyOrderId=el.dataset.id; go('verify'); return setTimeout(()=>openVerifyConfirm(el.dataset.id),120); }
        if (action==='fill-code') { const input=$('#verifyCode'); if(input){input.value=el.dataset.code;input.focus();} return; }
        if (action==='query-order-code') { const code=$('#verifyCode')?.value.trim(); const order=state.orders.find(o=>o.code===code); state.verifyOrderId=order?order.id:'__missing__'; return render(false); }
        if (action==='confirm-verify-open') return openVerifyConfirm(el.dataset.id);
        if (action==='confirm-verify') return completeVerify(el.dataset.id);
        if (action==='show-binding-code') return showModal('站点用户绑定入口',`<div style="display:grid;place-items:center;text-align:center"><div class="qr-mock" style="width:150px;height:150px;flex-basis:150px"></div><h3 style="margin:18px 0 6px">天河悦康社区合作站</h3><p class="modal-copy" style="margin:0">用户可使用小程序扫描二维码，或手动输入绑定码 <strong style="color:var(--brand)">THYK2026</strong>。</p></div>`,`<button class="btn ghost" data-action="close-modal">关闭</button><button class="btn primary" data-action="copy-binding-code">复制绑定码</button>`);
        if (action==='copy-binding-code') { navigator.clipboard?.writeText('THYK2026').catch(()=>{}); return toast('绑定码 THYK2026 已复制'); }
        if (action==='copy-recommend-code') { navigator.clipboard?.writeText('THYK8891').catch(()=>{}); return toast('推荐码 THYK8891 已复制'); }
        if (action==='view-bound-user') { const user=state.boundUsers.find(item=>item.id===el.dataset.id); if(!user)return; return showModal('绑定用户统计',`<div class="info-row"><span>用户</span><strong>${user.name} · ${user.phone}</strong></div><div class="info-row"><span>绑定方式</span><strong>${user.source}</strong></div><div class="info-row"><span>绑定时间</span><strong>${user.boundAt}</strong></div><div class="info-row"><span>首次自提订单</span><strong>${user.firstOrder}</strong></div><div class="info-row"><span>累计订单</span><strong>${user.orders} 笔</strong></div><div class="info-row"><span>累计消费</span><strong>${money(user.amount)}</strong></div><div class="info-row"><span>累计提成</span><strong style="color:var(--brand)">${money(user.commission || 0)}</strong></div>`); }
        if (action==='edit-station-profile') return openStationProfileEditor();
        if (action==='select-map-location') {
          const address = el.dataset.address;
          const addressInput = $('#editStationAddress');
          const lngInput = $('#editStationLng');
          const latInput = $('#editStationLat');
          const searchInput = $('#mapSearch');
          const caption = $('#mapCaption');
          if (addressInput) addressInput.value = address;
          if (lngInput) lngInput.value = el.dataset.lng;
          if (latInput) latInput.value = el.dataset.lat;
          if (searchInput) searchInput.value = address;
          if (caption) caption.textContent = address;
          document.querySelectorAll('.map-option').forEach(option=>option.classList.toggle('selected',option===el));
          return;
        }
        if (action==='search-map-location') {
          const keyword = $('#mapSearch')?.value.trim() || '';
          if (!keyword) return toast('请输入道路、门牌号或地标');
          const option = [...document.querySelectorAll('.map-option')].find(item=>item.dataset.address.includes(keyword) || keyword.includes(item.dataset.address));
          if (!option) return toast('未找到匹配地址，请从地图候选点中选择');
          option.click();
          return toast('已在地图中定位该地址');
        }
        if (action==='save-station-profile') return saveStationProfile();
        if (action==='edit-hours') return openHours(el.dataset.type);
        if (action==='save-hours') { const start=$('#startHour')?.value,end=$('#endHour')?.value; if(!start||!end||start>=end)return toast('请设置正确的营业时间'); state.healthHours=start+'–'+end; addLog('健康服务','修改营业时间',state.healthHours); closeModal();render(false);return toast('营业时间已更新'); }
        if (action==='toggle-health') return toggleHealth();
        if (action==='confirm-toggle-health') { state.healthOpen=false; addLog('健康服务','暂停营业状态','停止接收新的自提订单'); closeModal();render(false);return toast('已暂停接收新的自提订单'); }
        if (action==='toggle-blood') return toggleBlood();
        if (action==='confirm-toggle-blood') { state.bloodOpen=false; addLog('采血服务','暂停营业状态','停止接收新的采血服务'); closeModal();render(false);return toast('已暂停接收新的采血服务'); }
        if (action==='open-add-worker') return openWorkerModal(el.dataset.type);
        if (action==='search-worker') return searchWorker(el.dataset.type);
        if (action==='add-worker') return addWorker(el.dataset.type,el.dataset.phone);
        if (action==='unbind-worker') { const w=state.workers.find(x=>x.id===el.dataset.id); if(!w)return; return showModal('确认解绑工作人员',`<div class="confirm-icon">解</div><div class="modal-copy">解绑后，${w.name} 将立即失去${el.dataset.type==='health'?'健康服务核销':'采血服务处理'}权限，既有操作记录仍会保留。</div>`,`<button class="btn ghost" data-action="close-modal">取消</button><button class="btn danger" data-action="confirm-unbind" data-id="${w.id}" data-type="${el.dataset.type}">确认解绑</button>`); }
        if (action==='confirm-unbind') { const w=state.workers.find(x=>x.id===el.dataset.id); if(w){w[el.dataset.type]=false;addLog('工作人员','解绑工作人员',`${w.name} · ${el.dataset.type==='health'?'健康服务':'采血服务'}`);} closeModal();render(false);return toast('工作人员已解绑'); }
        if (action==='view-worker') return showModal('工作人员操作记录',`<div class="info-row"><span>工作人员</span><strong>${state.workers.find(w=>w.id===el.dataset.id)?.name||'—'}</strong></div><div class="info-row"><span>最近操作</span><strong>2026-08-26 09:12</strong></div><div class="info-row"><span>累计业务操作</span><strong>${state.workers.find(w=>w.id===el.dataset.id)?.records||0} 次</strong></div><div class="notice blue" style="margin-top:14px"><strong>历史记录永久保留</strong>即使工作人员解绑，既有核销、接收和寄样记录仍保留原操作人。</div>`);
        if (action==='view-blood') { state.selectedBloodId=el.dataset.id; return go('blood-detail'); }
        if (action==='fill-blood-id') { const input=$('#bloodFormId'); if(input){input.value=el.dataset.code;input.focus();} return; }
        if (action==='query-blood-id') { const bloodId=$('#bloodFormId')?.value.trim(); const b=state.bloodForms.find(x=>x.id.toLowerCase()===String(bloodId).toLowerCase()); state.receiveBloodId=b?b.id:'__missing__'; return render(false); }
        if (action==='receive-blood') return receiveBlood(el.dataset.id);
        if (action==='confirm-receive-blood') return completeReceive(el.dataset.id);
        if (action==='ship-blood') return shipBlood(el.dataset.id);
        if (action==='confirm-ship-blood') return completeShip(el.dataset.id);
        if (action==='export-demo') return toast('已生成演示导出任务');
        if (action==='save-password') { const old=$('#oldPassword')?.value,nw=$('#newPassword')?.value,confirm=$('#confirmPassword')?.value; if(!old||!nw||!confirm)return toast('请完整填写密码信息'); if(nw.length<8)return toast('新密码至少需要 8 位'); if(nw!==confirm)return toast('两次输入的新密码不一致'); $('#oldPassword').value=$('#newPassword').value=$('#confirmPassword').value=''; addLog('账号安全','修改登录密码','共享管理员账号密码已更新'); return toast('登录密码修改成功'); }
      });

      document.addEventListener('input', event => {
        if (event.target.id==='orderSearch') {
          state.orderQuery=event.target.value;
          const host=$('#ordersTableHost'); if(host) host.innerHTML=ordersTable();
        }
        if (event.target.id==='boundUserSearch') {
          state.boundUserQuery=event.target.value;
          const host=$('#boundUsersTableHost'); if(host) host.innerHTML=boundUsersTable();
        }
        if (event.target.id==='bloodSearch') {
          state.bloodQuery=event.target.value;
          const host=$('#bloodTableHost'); if(host) host.innerHTML=bloodTable();
        }
        if (event.target.id==='verifyCode') event.target.value=event.target.value.replace(/\D/g,'').slice(0,6);
      });

      modalLayer.addEventListener('click', event => { if (event.target===modalLayer) closeModal(); });
      document.addEventListener('keydown', event => { if(event.key==='Escape') closeModal(); });

      render(false);
    })();
  </script>
</body>
</html>
